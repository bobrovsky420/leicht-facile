[project]
name = "leichtfacile"
version = "0.9.0"
description = "Drafts easy-language versions of Swiss official texts with a large language model."
# README.md with absolute links for pypi.org (the hook below)
dynamic = ["readme"]
license = "Apache-2.0"
authors = [
    { name = "Alexander Bobrovsky", email = "bobrovsky@seznam.cz" },
    { name = "Ivan Kuzmych", email = "i.kuzmych@hotmail.com" },
]
keywords = ["easy language", "Leichte Sprache", "FALC", "lingua facile", "plain language", "LLM", "Apertus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Italian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.12"
# leichtfacile-model-de and -fr: spaCy's models for German and French, republished on
# PyPI (the tables [tool.leichtfacile.spacy-models] below, the same versions);
# leichtfacile-model-it: the Italian pipeline built on the Morph-it! lexicon (the table
# [tool.leichtfacile.lexicon-models.it] below, the same version).
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.12",
    "openai>=3.0",
    "httpx>=0.28",
    "spacy>=3.8.16,<3.9",
    "trafilatura>=2.3",
    "pdfplumber>=0.11.10",
    "pyphen>=0.18",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "wordfreq>=3.1.1",
    "tomlkit>=0.13",
    "python-dotenv>=1.1",
    "leichtfacile-model-de==3.8.0",
    "leichtfacile-model-fr==3.8.0",
    "leichtfacile-model-it==1.0.1",
]

[project.urls]
Homepage = "https://leichtfacile.ch"
Documentation = "https://github.com/bobrovsky420/leicht-facile/blob/main/docs/quickstart.md"
Source = "https://github.com/bobrovsky420/leicht-facile"
Issues = "https://github.com/bobrovsky420/leicht-facile/issues"

[project.scripts]
leichtfacile = "leichtfacile.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=8.4",
    "pyyaml>=6.0.3",
    "ruff>=0.13",
]

# spaCy's models for German and French, republished with their files unchanged as the
# packages leichtfacile-model-de and leichtfacile-model-fr: spaCy publishes them on
# GitHub only, and PyPI refuses dependencies given by URL. scripts/model_packages.py
# builds the packages from spaCy's wheel (its name, version and SHA-256 here), with the
# license expression given here; .github/workflows/models.yml publishes them. A new
# version is published first, then pinned in `dependencies` (tests/test_release.py).
[tool.leichtfacile.spacy-models.de]
name = "de_core_news_md"
version = "3.8.0"
sha256 = "b903f59220f1e76dd672acdaa7fa454d6703fe056c5ccd6457820e70874116d0"
license = "MIT"

[tool.leichtfacile.spacy-models.fr]
name = "fr_core_news_md"
version = "3.8.0"
sha256 = "8a70d090a54ef77525c3ffa6a6195b9d365f2cf369ae1cd84ede93f3d709079e"
license = "LicenseRef-LGPL-LR"

# The Italian pipeline: spaCy's blank Italian tokenizer and sentencizer with the
# Morph-it! lexicon as the tagger (scripts/morphit.py), built by
# scripts/lexicon_package.py as the package leichtfacile-model-it and published by
# .github/workflows/models.yml like the spaCy models, since every spaCy Italian model
# is licensed CC BY-NC-SA (docs/rules.md). Morph-it! (Eros Zanchetta and Marco Baroni,
# University of Bologna, 0.4.8, CC BY-SA 2.0 and LGPL) is taken from the archive of the
# Language Bank of Finland's HFST build, which carries the original text file and its
# readme; the authors' site refuses downloads by scripts. The archive and the lexicon
# inside it are pinned by SHA-256; `version` is the package's own.
[tool.leichtfacile.lexicon-models.it]
name = "morphit"
version = "1.0.1"
source_version = "0.4.8"
url = "https://kielipankki.fi/download/hfst-morphologies/test/it/morph-it/hfst-it-morph-morph-it.zip"
sha256 = "895913df4b60435d01362674ae56612c0d3546e452b2ad75b2dfe1e0f48f651f"
lexicon = "hfst-it-morph-morph-it/morph-it/morph-it_048.txt.utf8"
lexicon_sha256 = "7375216351ee59cee4326b455503f3a6c4e9542cd63ecb86ff5cd58ca5c8e800"
readme = "hfst-it-morph-morph-it/morph-it/readme-morph-it.txt"
lgpl = "hfst-it-morph-morph-it/morph-it/lgpl.txt"
license = "CC-BY-SA-2.0 OR LGPL-2.1-or-later"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leichtfacile"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# pypi.org shows the README without the repository, so its relative images and links
# become absolute there; README.md itself keeps relative links.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/bobrovsky420/leicht-facile/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/bobrovsky420/leicht-facile/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/bobrovsky420/leicht-facile#'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# First-party packages for the import order: leichtfacile and the tests.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
