[project]
name = "leichtfacile"
version = "0.1.0"
description = "Drafts easy-language versions of Swiss official texts with Apertus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "openai>=3.0",
    "httpx>=0.28",
    "spacy>=3.8.16,<3.9",
    "de-core-news-md",
]

[project.scripts]
leichtfacile = "leichtfacile.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv.sources]
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leichtfacile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
