[project]
name = "leichtfacile"
version = "0.1.0"
description = "Drafts easy-language versions of Swiss official texts with Apertus."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Alexander Bobrovsky", email = "bobrovsky@seznam.cz" },
    { name = "Ivan Kuzmych", email = "i.kuzmych@hotmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "openai>=3.0",
    "httpx>=0.28",
    "spacy>=3.8.16,<3.9",
    "de-core-news-md",
    "fr-core-news-md",
    "trafilatura>=2.3",
    "pdfplumber>=0.11.10",
    "pyphen>=0.18",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "wordfreq>=3.1.1",
]

[project.scripts]
leichtfacile = "leichtfacile.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=8.4",
    "pyyaml>=6.0.3",
    "ruff>=0.13",
]

[tool.uv.sources]
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["track_2b/src/leichtfacile"]

[tool.pytest.ini_options]
testpaths = ["track_2b/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# First-party packages for the import order: leichtfacile and the tests.
src = ["track_2b/src", "track_2b"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
