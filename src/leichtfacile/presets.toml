# The known model endpoints (docs/configuration.md, "Presets"): one table per preset, in
# the order `leichtfacile setup` offers them. A table takes the keys of an
# [endpoints.<name>] table, `label` among them; the settings check it like any other
# source. A new table is a new preset.
#
# A server of one's own has no model here, since each server names its own:
# `leichtfacile setup <preset>` lists the server's models and asks which one. A preset
# with a model would count as ready while nothing listens at its address.

# Apertus on the CSCS inference API, Lugano: the endpoint of the reported numbers.
# Thinking models are separate model names ending in "-thinking". CSCS closes about one
# long thinking stream in four midway (6 October 2026); the default retries
# (llm.max_retries) make a hard failure rare.
[cscs]
label = "Apertus on the CSCS inference API"
url = "https://api.inference.cscs.ch/v1"
api_key_env = "CSCS_API_KEY"
models = { writer = "swiss-ai/Apertus-v1.5-8B", judge = "swiss-ai/Apertus-v1.5-70B" }
thinking = "model-suffix"

# Apertus on the Public AI gateway, for public documents only: run by Metagov Inc. (US
# nonprofit), requests go to compute partners. The 8B (Juelich, vLLM) thinks when asked
# through the chat template; the 70B (Infomaniak) ignores the switch. The gateway caches
# answers without regard to the switch, so extra_body turns its cache off. Its
# "-thinking" names serve the older Apertus 1 without thinking. Checked on 6 October 2026.
[apertus]
label = "Apertus on the Public AI gateway (public documents only)"
url = "https://api.publicai.co/v1"
api_key_env = "PUBLICAI_API_KEY"
models = { writer = "swiss-ai/apertus-v1.5-8b", judge = "swiss-ai/apertus-v1.5-70b" }
thinking = "chat-template"
extra_body = { cache = { no-cache = true } }

# llama.cpp (llama-server, port 8080) on this machine, or another OpenAI-compatible server
# (`--base-url`). Such a server takes any key. With `--jinja` llama.cpp switches thinking
# through the chat template; on a small GPU a thinking call takes minutes, so one call
# may take 30 minutes (docs/quickstart.md, "Running a model yourself").
[local]
label = "llama.cpp or another server of your own (port 8080)"
url = "http://127.0.0.1:8080/v1"
api_key = "local"
thinking = "chat-template"
timeout_s = 1800

# Ollama on this machine (port 11434): the models `ollama list` shows. Ollama ignores the
# key and the chat-template switch; a thinking model (Qwen) takes
# `thinking = "reasoning-effort"` on the saved endpoint, which the preset does not set,
# since a model without thinking may refuse the field.
[ollama]
label = "Ollama on this machine (port 11434)"
url = "http://127.0.0.1:11434/v1"
api_key = "ollama"

# vLLM (port 8000, the app's port too: on one machine start one of them elsewhere),
# mostly on a GPU machine of the organisation (`--base-url http://<server>:8000/v1`);
# the Swiss AI team's image serves swiss-ai/Apertus-v1.5-8B and switches thinking
# through the chat template (docs/architecture.md §10).
[vllm]
label = "vLLM, a server of the organisation (port 8000)"
url = "http://127.0.0.1:8000/v1"
api_key = "local"
thinking = "chat-template"

# OpenAI's GPT-5 models (the current line: gpt-5.4-nano, gpt-5.6-luna, gpt-5.6-terra, ...)
# refuse `max_tokens` and any temperature but their default; a GPT-4.1 model would take
# `send_temperature = true` on the saved endpoint. Thinking is `reasoning_effort` (none,
# low, medium, high, xhigh from 5.4 on): `thinking = "reasoning-effort"` on the saved
# endpoint, with `thinking_stages = []` for none everywhere. Checked 25 October 2026.
[openai]
label = "OpenAI (US cloud, public documents only)"
url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens_key = "max_completion_tokens"
send_temperature = false

[mistral]
label = "Mistral AI"
url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"

# Groq (US cloud, very fast inference): public documents only. The models come and go
# (several are previews), so `leichtfacile setup groq` lists them instead of a default.
# Thinking stays off: Qwen reasons on Groq only when asked with reasoning_effort low,
# medium or high (checked 25 October 2026), and the gpt-oss models refuse "none".
[groq]
label = "Groq (US cloud, public documents only)"
url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

# The Hugging Face Inference Providers router sends each request to a third-party
# provider, mostly outside Switzerland: development and public documents only. Models are
# Hugging Face ids, with an optional provider suffix (`Qwen/Qwen3.5-9B:groq`);
# `leichtfacile setup huggingface` lists them. The token is the user's HF_TOKEN.
[huggingface]
label = "Hugging Face Inference Providers (third-party clouds, public documents only)"
url = "https://router.huggingface.co/v1"
api_key_env = "HF_TOKEN"

# Anthropic's Claude through its OpenAI-compatible endpoint (chat completions only; US
# cloud): public documents only. The 5.5 models refuse a temperature; the model list needs
# the anthropic-version header. The endpoint ignores reasoning_effort and counts Claude's
# adaptive thinking in max_tokens, so thinking is set on the saved endpoint through the
# native field: `extra_body = { thinking = { type = "disabled" } }` for Haiku 5.5,
# `{ type = "between_tools" }` for Sonnet 5.5 (each refuses the other's value; the
# endpoint refuses `adaptive`), `model_extra_body` when both share an endpoint; Opus 5.5
# always thinks (effort through `output_config = { effort = "low" }`). No model: `leichtfacile setup anthropic` lists
# them. Checked 25 October 2026.
[anthropic]
label = "Anthropic's Claude (US cloud, public documents only)"
url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
send_temperature = false
headers = { anthropic-version = "2023-06-01" }
