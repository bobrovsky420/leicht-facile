# German vocabulary for easy language (Leichte Sprache A2, Einfache Sprache B1), Swiss
# entries: the institutions, procedures and words of Switzerland (AHV, IV,
# Ergänzungsleistungen, Prämienverbilligung, Betreibung, KESB, Einsprache, Verfügung,
# innert, allfällig), the words that mean something else in Germany or Austria
# (Beschwerde, Beistand, Busse) and the entries whose explanation needs a Swiss
# marker (Kanton, Franken, Schweizer Pass, Spital, Steueramt, Entscheid). The Swiss
# variety, key de, reads vocabulary_de.toml and this file; together they are the
# German list as it was before the split of 29 October 2026, entry for entry.
# Written for this project; checked by tests/rules/test_vocabulary.py.
#
# Format, sources and spelling (ss, never sharp s): the header of vocabulary_de.toml.
# A trailing "# TERMDAT <id>" names the entry of the federal terminology database
# (www.termdat.bk.admin.ch/entry/<id>) that confirms the official term; terms TERMDAT
# lacks name the Swiss act that defines them ("# ELG Art. 11"). A term stands in this
# file or in vocabulary_de.toml, never in both.

# -- replace -----------------------------------------------------------------------

[replace.connectors]
"innert" = "innerhalb von"
"diesfalls" = "dann"
"obgenannt" = "oben genannt"

[replace.adverbs]
"allfällig" = "möglich"
"vorgängig" = "vorher"
"gesamthaft" = "zusammen"

[replace.verbs]
"retournieren" = "zurückschicken"

[replace.nouns]
"Drittperson" = "andere Person"
"Leistungsbezüger" = "Person, die Geld oder Hilfe bekommt"
"Wegleitung" = "Anleitung"
"Mietzins" = "Miete"
"obligatorische Krankenpflegeversicherung" = "Grundversicherung"  # TERMDAT 37586
"Kindes- und Erwachsenenschutzbehörde" = "KESB"  # TERMDAT 379564
"Attest" = "Arztzeugnis"

[replace.abbreviations]
"EL" = "Ergänzungsleistungen"
"IPV" = "Prämienverbilligung"
"KVG" = "Gesetz über die Krankenversicherung"
"ELG" = "Gesetz über die Ergänzungsleistungen"
"BehiG" = "Gesetz für die Gleichstellung von Menschen mit Behinderung"

[replace.context]
# Words whose hard sense depends on the letter (ausrichten: to pay out or to pass on).
# The writer gets them as a hint; code never flags them.
"ausrichten" = "auszahlen"

