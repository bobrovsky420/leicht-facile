# German vocabulary for easy language (Leichte Sprache A2, Einfache Sprache B1),
# entries of Germany: the authorities, procedures, benefits and office words of German
# letters (Bescheid, Widerspruch, Jobcenter, Bürgergeld, Pflegegrad, Finanzamt,
# zeitnah, in Rechnung stellen). The variety de-DE reads vocabulary_de.toml and this
# file; a term stands in one of the two only. Written for this project, every
# explanation our own; checked by tests/rules/test_vocabulary.py.
#
# Format: the header of vocabulary_de.toml. A trailing comment cites the act that
# defines the term or sets the rule the explanation states ("# SGB II § 7",
# "# VwVfG § 41"); an institution or a word without such an act has none.
#
# Written in the Swiss spelling like every German file (ss, never sharp s), so the
# tests check every explanation with the Swiss checker; the loader writes sharp s for
# Germany where rules/data/spelling_de.toml says so (Bussgeld: Bußgeld). Amounts change
# every year and stay out of the explanations; the periods and deadlines are those in
# force on 29 October 2026.

# -- replace -----------------------------------------------------------------------

[replace.connectors]
"binnen" = "innerhalb von"
"anbei" = "mit diesem Brief"
"nunmehr" = "jetzt"
"insoweit" = "in diesem Punkt"
"zuständigkeitshalber" = "an das richtige Amt"

[replace.adverbs]
"zeitnah" = "bald"
"fristwahrend" = "rechtzeitig"
"vorsorglich" = "zur Sicherheit"
"fernmündlich" = "am Telefon"
"unaufgefordert" = "von sich aus"
"hilfebedürftig" = "hat zu wenig Geld zum Leben"

[replace.verbs]
"in Rechnung stellen" = "verlangen"
"zur Kenntnis nehmen" = "lesen"
"zukommen lassen" = "schicken"
"vorstellig werden" = "vorbeikommen"
"aufrechnen" = "abziehen"
"zurückweisen" = "ablehnen"

[replace.nouns]
"Bescheinigung" = "Bestätigung"
"Vordruck" = "Formular"
"Erstattung" = "Rückzahlung"
"Rücksprache" = "Gespräch"
"Attest" = "Bestätigung vom Arzt"

[replace.abbreviations]
"SGB" = "Sozialgesetzbuch"
"GdB" = "Grad der Behinderung"
"Az." = "Aktenzeichen"
"gem." = "nach"
"i. V. m." = "zusammen mit"

[replace.context]
# Words whose hard sense depends on the letter (Anlage: an enclosure or a facility).
# The writer gets them as a hint; code never flags them.
"Anlage" = "Blatt im gleichen Brief"
"erstatten" = "zurückzahlen"
"Massnahme" = "Schritt"

# -- explain -----------------------------------------------------------------------

[explain.law]
"Bescheid" = "Ein Bescheid ist ein Brief vom Amt mit einer Entscheidung. Die Entscheidung gilt für Sie. Sie können sich dagegen wehren."  # VwVfG § 35, SGB X § 31
"Widerspruch" = "Sie sind mit einem Bescheid nicht einverstanden? Dann schreiben Sie dem Amt einen Widerspruch. Die Frist steht im Bescheid. Meistens ist es ein Monat."  # VwGO § 70, SGG § 84
"Widerspruchsbescheid" = "Das Amt hat Ihren Widerspruch geprüft. Der Widerspruchsbescheid ist seine Antwort darauf."  # VwGO § 73, SGG § 85
"Rechtsbehelfsbelehrung" = "Dieser Text steht am Ende von einem Bescheid. Er sagt: So können Sie sich wehren. Er sagt auch, bis wann und bei wem."  # VwGO § 58, SGB X § 36
"Bekanntgabe" = "Bekanntgabe heisst: Sie bekommen den Bescheid. Das Amt schickt ihn mit der Post? Dann gilt er am 4. Tag danach als bekannt. Ab diesem Tag läuft die Frist."  # VwVfG § 41, SGB X § 37
"Zustellung" = "Zustellung heisst: Das Amt gibt Ihnen einen Brief auf eine besondere Art. Die Post schreibt dabei das Datum auf. Oft beginnt an diesem Tag eine Frist."  # VwZG § 2
"Anhörung" = "Vor einer Entscheidung fragt das Amt nach Ihrer Meinung. Das ist die Anhörung. Meistens antworten Sie mit einem Brief."  # SGB X § 24, VwVfG § 28
"Klage" = "Mit einer Klage bitten Sie ein Gericht um eine Entscheidung. Gegen einen Bescheid klagen Sie meistens erst nach dem Widerspruch. Dafür haben Sie meistens einen Monat Zeit."  # VwGO § 74, SGG § 87
"Verwaltungsgericht" = "Das Verwaltungsgericht prüft Bescheide von Ämtern. Zum Beispiel vom Bürgeramt oder von der Ausländerbehörde."  # VwGO § 40
"Sozialgericht" = "Das Sozialgericht prüft Bescheide zu Sozialleistungen. Zum Beispiel vom Jobcenter oder von der Krankenkasse. Das Verfahren kostet Sie nichts."  # SGG § 51, § 183
"Gericht" = "Ein Gericht entscheidet bei einem Streit. Es prüft auch Bescheide von Ämtern."
"Behörde" = "Eine Behörde ist ein Amt. Zum Beispiel das Jobcenter oder das Finanzamt."
"bestandskräftig" = "Bestandskräftig heisst: Die Frist für den Widerspruch ist vorbei. Der Bescheid gilt jetzt endgültig."  # SGG § 77, VwGO § 70
"aufschiebende Wirkung" = "Sie wehren sich gegen einen Bescheid. Bis zur Entscheidung gilt der Bescheid dann noch nicht. Manche Bescheide gelten aber trotzdem sofort. Das steht dann im Bescheid."  # VwGO § 80, SGG § 86a
"Überprüfungsantrag" = "Die Frist für den Widerspruch ist vorbei? Sie halten den Bescheid trotzdem für falsch? Dann stellen Sie einen Überprüfungsantrag. Das Amt prüft den Bescheid dann noch einmal."  # SGB X § 44
"Wiedereinsetzung in den vorigen Stand" = "Sie haben eine Frist ohne Ihre Schuld verpasst? Zum Beispiel wegen einer Krankheit. Dann bitten Sie das Amt um Wiedereinsetzung. Dafür haben Sie 2 Wochen Zeit. Ihr Brief zählt dann noch als rechtzeitig."  # VwVfG § 32, SGB X § 27
"Prozesskostenhilfe" = "Sie haben wenig Geld? Dann zahlt der Staat die Kosten für das Gericht. Sie bekommen auch eine Anwältin oder einen Anwalt. Ihre Klage muss aber Chancen haben."  # ZPO § 114
"Ordnungswidrigkeit" = "Eine Ordnungswidrigkeit ist ein kleiner Verstoss gegen eine Regel. Zum Beispiel falsches Parken. Dann müssen Sie ein Bussgeld bezahlen."  # OWiG § 1
"Bussgeld" = "Ein Bussgeld ist Geld als Strafe. Sie bezahlen es zum Beispiel für zu schnelles Fahren."  # OWiG § 17
"Bussgeldbescheid" = "Mit diesem Brief verlangt das Amt ein Bussgeld von Ihnen. Sie können sich innerhalb von 2 Wochen mit einem Einspruch wehren."  # OWiG § 65, § 67
"Einspruch" = "Mit einem Einspruch wehren Sie sich gegen einen Bescheid. Zum Beispiel gegen einen Steuerbescheid oder einen Bussgeldbescheid. Die Frist steht im Bescheid."  # AO § 347, OWiG § 67
"Zwangsgeld" = "Das Amt verlangt etwas von Ihnen. Sie tun es aber nicht. Dann kann das Amt Geld von Ihnen verlangen. Das ist ein Zwangsgeld."  # VwVG § 11
"Vollstreckung" = "Sie haben eine Schuld beim Amt nicht bezahlt? Dann holt das Amt das Geld mit Zwang. Zum Beispiel von Ihrem Konto oder Ihrem Lohn."  # VwVG § 1
"Führungszeugnis" = "Ein Papier vom Bundesamt für Justiz. Es zeigt Ihre Strafen. Sie brauchen es zum Beispiel für manche Arbeitsstellen. Sie bestellen es beim Bürgeramt."  # BZRG § 30
"rechtliche Betreuung" = "Sie können wichtige Sachen nicht mehr allein regeln? Zum Beispiel wegen einer Krankheit. Dann bestimmt das Betreuungsgericht eine Person für Sie. Diese Person hilft Ihnen bei diesen Sachen."  # BGB § 1814
"Beistandschaft" = "Das Jugendamt hilft Ihnen beim Unterhalt für Ihr Kind. Es holt zum Beispiel das Geld beim anderen Elternteil. Das ist eine Beistandschaft."  # BGB § 1712
"Vorsorgevollmacht" = "Mit einer Vorsorgevollmacht bestimmen Sie heute eine Person. Später können Sie vielleicht nicht mehr selbst entscheiden. Dann handelt diese Person für Sie."  # BGB § 1820
"Aktenzeichen" = "Das Aktenzeichen ist die Nummer von Ihrer Sache beim Amt. Schreiben Sie es auf jeden Brief an das Amt."

[explain.debt]
"Kassenzeichen" = "Das Kassenzeichen ist eine Nummer für Ihre Zahlung. Schreiben Sie es bei jeder Zahlung dazu. Dann findet das Amt Ihr Geld."
"Mahngebühr" = "Sie haben zu spät bezahlt. Dann verlangt das Amt eine Mahngebühr. Das ist Geld für die Mahnung."  # VwVG § 19
"Säumniszuschlag" = "Sie haben eine Steuer oder einen Beitrag zu spät bezahlt? Dann müssen Sie mehr bezahlen. Jeden Monat kommt 1 Prozent dazu."  # AO § 240, SGB IV § 24
"Mahnbescheid" = "Ein Mahnbescheid kommt vom Gericht. Darin verlangt jemand Geld von Ihnen. Sind Sie nicht einverstanden? Dann widersprechen Sie innerhalb von 2 Wochen."  # ZPO § 688, § 692
"Gerichtsvollzieher" = "Der Gerichtsvollzieher holt Geld bei Menschen mit Schulden. Er arbeitet für das Gericht. Er kann auch Sachen von Ihnen nehmen."  # ZPO § 753
"Pfändung" = "Bei einer Pfändung nimmt der Staat einen Teil von Ihrem Geld. Zum Beispiel vom Lohn oder vom Konto. Damit bezahlt er Ihre Schulden."  # ZPO § 803, § 850
"Pfändungsschutzkonto" = "Auf diesem Konto ist ein Teil von Ihrem Geld geschützt. Niemand darf es pfänden. Fragen Sie Ihre Bank danach."  # ZPO § 850k
"Privatinsolvenz" = "Sie können Ihre Schulden nicht mehr bezahlen? Dann hilft vielleicht eine Privatinsolvenz. Nach 3 Jahren sind Sie meistens schuldenfrei. Eine Beratungsstelle hilft Ihnen dabei."  # InsO § 287, § 300

[explain.insurance]
"Krankenkasse" = "Die Krankenkasse bezahlt Kosten für Arzt und Krankenhaus. Sie bezahlt auch Medikamente. Alle Menschen in Deutschland müssen krankenversichert sein."  # SGB V § 5, VVG § 193
"Sozialversicherung" = "Sozialversicherungen helfen bei Krankheit oder Unfall. Sie helfen auch im Alter und ohne Arbeit. Zum Beispiel die Krankenkasse oder die Rentenversicherung."  # SGB IV § 1
"Pflegegrad" = "Der Pflegegrad zeigt: So viel Hilfe brauchen Sie im Alltag. Es gibt 5 Pflegegrade. Davon hängt das Geld von der Pflegekasse ab."  # SGB XI § 15
"Pflegegeld" = "Pflegegeld ist Geld von der Pflegekasse. Sie bekommen es ab Pflegegrad 2. Damit bezahlen Sie zum Beispiel Ihre Familie für die Pflege zu Hause."  # SGB XI § 37
"Grad der Behinderung" = "Diese Zahl zeigt: So stark ist Ihre Behinderung. Sie liegt zwischen 20 und 100. Ab 50 sind Sie schwerbehindert."  # SGB IX § 152, § 2
"Schwerbehindertenausweis" = "Diesen Ausweis bekommen Sie bei einer schweren Behinderung. Er bringt Ihnen Vorteile. Zum Beispiel beim Bus und bei den Steuern."  # SGB IX § 152
"Eingliederungshilfe" = "Die Eingliederungshilfe ist Hilfe für Menschen mit Behinderung. Damit können sie besser am Leben teilnehmen. Zum Beispiel an der Arbeit oder in der Schule."  # SGB IX § 90
"Rentenversicherung" = "Die Rentenversicherung zahlt Ihre Rente im Alter. Können Sie wegen Krankheit nicht mehr arbeiten? Dann zahlt sie auch eine Rente. Sie und Ihr Arbeitgeber bezahlen jeden Monat Beiträge."  # SGB VI § 1
"Erwerbsminderungsrente" = "Sie können wegen Ihrer Gesundheit nur wenig oder gar nicht arbeiten? Dann bekommen Sie vielleicht eine Erwerbsminderungsrente. Sie kommt von der Rentenversicherung."  # SGB VI § 43
"Krankengeld" = "Sie sind länger als 6 Wochen krank? Dann bekommen Sie Krankengeld von der Krankenkasse. Vorher bezahlt Ihr Arbeitgeber den Lohn weiter."  # SGB V § 44, EntgFG § 3
"Arbeitslosengeld" = "Sie haben Ihre Arbeit verloren? Dann bekommen Sie Arbeitslosengeld von der Agentur für Arbeit. Dafür müssen Sie vorher mindestens 12 Monate versichert sein."  # SGB III § 136, § 142
"Agentur für Arbeit" = "Die Agentur für Arbeit hilft bei der Suche nach Arbeit. Sie zahlt auch das Arbeitslosengeld."  # SGB III § 368
"Sperrzeit" = "In der Sperrzeit bekommen Sie kein Arbeitslosengeld. Das ist eine Strafe. Zum Beispiel nach einer eigenen Kündigung."  # SGB III § 159

[explain.health]
"stationär" = "Stationär heisst: Sie bleiben für die Behandlung über Nacht im Krankenhaus."
"Arbeitsunfähigkeitsbescheinigung" = "Die Praxis bestätigt: Sie sind krank und können nicht arbeiten. Das ist die Arbeitsunfähigkeitsbescheinigung. Viele sagen Krankschreibung."  # EntgFG § 5
"Zuzahlung" = "Für Medikamente und manche Behandlungen bezahlen Sie einen kleinen Teil selbst. Das ist die Zuzahlung. Kinder müssen nichts zuzahlen."  # SGB V § 61, § 31

[explain.social]
"Bürgergeld" = "Das Bürgergeld heisst seit Juli 2026 Grundsicherungsgeld. Es ist Geld vom Jobcenter. Es ist für Menschen mit zu wenig Geld zum Leben. Diese Menschen können aber arbeiten."  # SGB II § 19; renamed by the 13. SGB II-Änderungsgesetz, in force 1 July 2026
"Grundsicherungsgeld" = "Das Grundsicherungsgeld ist Geld vom Jobcenter. Es ist für Menschen mit zu wenig Geld zum Leben. Diese Menschen können aber arbeiten. Der frühere Name ist Bürgergeld."  # SGB II § 19 (since 1 July 2026)
"Grundsicherung" = "Die Grundsicherung ist Geld vom Staat für den Alltag. Sie ist für Menschen mit zu wenig Geld zum Leben. Zum Beispiel im Alter oder ohne Arbeit."  # SGB II § 19, SGB XII § 41
"erwerbsfähig" = "Erwerbsfähig heisst: Sie können mindestens 3 Stunden am Tag arbeiten."  # SGB II § 8
"Regelbedarf" = "Der Regelbedarf ist ein fester Betrag für den Alltag. Zum Beispiel für Essen und Kleidung. Der Staat legt den Betrag jedes Jahr fest."  # SGB II § 20
"Mehrbedarf" = "Manche Menschen haben höhere Kosten im Alltag. Zum Beispiel Schwangere oder Alleinerziehende. Dann bekommen sie mehr Geld. Das ist der Mehrbedarf."  # SGB II § 21
"Bedarfsgemeinschaft" = "Dazu gehören die Menschen in Ihrem Haushalt mit Pflichten füreinander. Zum Beispiel Paare und ihre Kinder. Das Jobcenter rechnet für sie zusammen."  # SGB II § 7
"Kosten der Unterkunft" = "Das Jobcenter oder das Sozialamt bezahlt Ihre Miete und die Heizung. Die Wohnung darf aber nicht zu teuer sein."  # SGB II § 22
"Jobcenter" = "Das Jobcenter zahlt das Grundsicherungsgeld, früher Bürgergeld. Es hilft auch bei der Suche nach Arbeit."  # SGB II § 6d
"Kooperationsplan" = "Im Kooperationsplan schreiben Sie mit dem Jobcenter Ihre Ziele auf. Zum Beispiel eine neue Arbeit oder einen Kurs."  # SGB II § 15
"Leistungsminderung" = "Sie halten sich nicht an eine Pflicht? Dann kann das Jobcenter Ihr Geld kürzen. Das ist eine Leistungsminderung."  # SGB II § 31a
"Weiterbewilligungsantrag" = "Ihr Grundsicherungsgeld gilt nur für eine bestimmte Zeit. Danach brauchen Sie einen neuen Antrag. Das ist der Weiterbewilligungsantrag."  # SGB II § 37, § 41
"Sozialamt" = "Das Sozialamt ist ein Amt in der Stadt oder im Kreis. Es zahlt zum Beispiel die Sozialhilfe und die Grundsicherung."  # SGB XII § 3
"Wohngeld" = "Wohngeld ist Geld vom Staat für die Miete. Es ist für Menschen mit wenig Einkommen. Sie beantragen es bei der Wohngeldstelle."  # WoGG § 1
"Wohnberechtigungsschein" = "Mit diesem Schein dürfen Sie eine Sozialwohnung mieten. Sie bekommen ihn bei wenig Einkommen. Das Wohnungsamt stellt ihn aus."  # WoFG § 27
"Elterngeld" = "Elterngeld ist Geld für Eltern nach der Geburt. Sie arbeiten dann weniger oder gar nicht. So haben Sie mehr Zeit für Ihr Kind."  # BEEG § 1
"Kindergeld" = "Kindergeld ist Geld für Eltern. Sie bekommen es jeden Monat für jedes Kind. Die Familienkasse zahlt es."  # EStG § 62, § 66
"Unterhaltsvorschuss" = "Ein Elternteil zahlt den Unterhalt für das Kind nicht. Dann zahlt das Jugendamt vorläufig. Danach holt das Amt das Geld beim anderen Elternteil."  # UVG § 1, § 7
"Jugendamt" = "Das Jugendamt hilft Familien mit Kindern. Es berät Eltern und schützt Kinder."  # SGB VIII § 69
"Mietkaution" = "Geld als Sicherheit für den Vermieter. Sie bezahlen höchstens 3 Monatsmieten. Nach dem Auszug bekommen Sie das Geld zurück."  # BGB § 551

[explain.tax]
"Finanzamt" = "Das Finanzamt ist das Amt für die Steuern. Es prüft Ihre Steuererklärung. Danach schickt es Ihnen den Steuerbescheid."  # FVG § 2
"Steuerbescheid" = "Im Steuerbescheid steht: So viel Steuern müssen Sie bezahlen. Oder: So viel Geld bekommen Sie zurück."  # AO § 155
"Steuererklärung" = "Ein Formular für die Steuern. Darin schreiben Sie Ihr Einkommen auf. Das Finanzamt berechnet dann Ihre Steuern."  # EStG § 25
"Steuer-Identifikationsnummer" = "Jeder Mensch in Deutschland hat diese Nummer. Sie hat 11 Ziffern und ändert sich nie. Das Finanzamt braucht sie."  # AO § 139b
"Lohnsteuerbescheinigung" = "Ein Papier vom Arbeitgeber. Darauf steht Ihr Lohn für ein ganzes Jahr. Darauf stehen auch die bezahlten Steuern."  # EStG § 41b
"Rundfunkbeitrag" = "Für jede Wohnung bezahlen Sie den Rundfunkbeitrag. Er bezahlt das öffentliche Radio und Fernsehen. Mit wenig Geld können Sie eine Befreiung beantragen."  # RBStV § 2, § 4

[explain.residence]
"Bürgeramt" = "Ein Amt in der Stadt. Dort melden Sie Ihre Adresse. Nach einem Umzug haben Sie dafür 2 Wochen Zeit."  # BMG § 17
"Meldebescheinigung" = "Ein Papier vom Bürgeramt. Darauf steht Ihre Adresse. Sie brauchen es zum Beispiel für die Bank."  # BMG § 18
"Ausländerbehörde" = "Die Ausländerbehörde ist das Amt für Menschen aus dem Ausland. Sie entscheidet über Ihren Aufenthaltstitel."  # AufenthG § 71
"Aufenthaltstitel" = "Mit einem Aufenthaltstitel dürfen Sie in Deutschland leben. Es gibt verschiedene Arten. Zum Beispiel die Aufenthaltserlaubnis."  # AufenthG § 4
"Duldung" = "Sie müssen Deutschland eigentlich verlassen. Die Abschiebung ist aber im Moment nicht möglich. Darum dürfen Sie vorläufig bleiben."  # AufenthG § 60a
"Einbürgerung" = "Sie werden Bürgerin oder Bürger von Deutschland. Dann bekommen Sie den deutschen Pass."  # StAG § 10

[explain.vote]
"Wahlbenachrichtigung" = "Diesen Brief bekommen Sie vor einer Wahl. Darauf steht Ihr Wahllokal. Damit können Sie auch Briefwahl beantragen."  # BWO § 19
"Briefwahl" = "Sie wählen mit der Post. Dafür bekommen Sie die Papiere nach Hause."  # BWahlG § 36

[explain.context]
# Terms with a second, everyday sense (Betreuer at a youth camp, Beitrag in a
# newspaper). Kept for the writer and the termbase; code never adds them.
"Betreuer" = "Betreuer heisst hier: Diese Person hilft einem Erwachsenen bei wichtigen Sachen. Zum Beispiel beim Geld oder bei Briefen vom Amt. Das Betreuungsgericht bestimmt diese Person."  # BGB § 1816
"Beitrag" = "Ein Beitrag ist Geld für eine Versicherung. Zum Beispiel für die Krankenkasse. Bei Angestellten zieht der Arbeitgeber ihn vom Lohn ab."  # SGB IV § 28d

# -- not in ------------------------------------------------------------------------

# Phrases in which a term does not mean what the vocabulary explains:
# Bescheid sagen is no decision, im Widerspruch zu no objection.
[not_in]
"Bescheid" = ["Bescheid sagen", "Bescheid geben", "Bescheid gibt", "Bescheid wissen", "Bescheid weiss", "uns Bescheid", "mir Bescheid", "Ihnen Bescheid"]
"Widerspruch" = ["im Widerspruch", "in Widerspruch"]
