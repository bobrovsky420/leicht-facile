"attestato di carenza di beni" = "Un documento dell'ufficio di esecuzione. Lei deve ancora questi debiti."  # TERMDAT 38907
"minimo vitale" = "Il minimo vitale è la somma minima per la vita quotidiana. L'ufficio di esecuzione non può prendere questi soldi."  # TERMDAT 55347
"incasso" = "Lei deve dei soldi. Con l'incasso l'ufficio recupera questi soldi. A volte lo fa una ditta."
"consulenza sui debiti" = "Lei ha dei debiti? Degli esperti La aiutano. Fanno un piano con Lei."
"interesse moratorio" = "Lei paga una fattura in ritardo. Allora Lei paga di più. Questi soldi in più sono l'interesse moratorio."  # TERMDAT 43049
"estratto del registro delle esecuzioni" = "Un documento dell'ufficio di esecuzione. Mostra le Sue esecuzioni. I proprietari di case lo chiedono spesso."  # TERMDAT 384196
