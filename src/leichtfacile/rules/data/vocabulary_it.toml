"minorenne" = "Minorenne vuol dire: una persona con meno di 18 anni."
"maggiorenne" = "Maggiorenne vuol dire: una persona con 18 anni o più."
"permesso di dimora" = "Permesso di dimora è il nome ufficiale del permesso B. Lei può abitare in Svizzera per un certo tempo."  # TERMDAT 38369
