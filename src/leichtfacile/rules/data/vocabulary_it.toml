"curatela" = "Una persona La aiuta nelle cose importanti. Per esempio con i soldi o con le lettere degli uffici. L'ARP sceglie questa persona."  # TERMDAT 379528
"curatore" = "Un curatore o una curatrice La aiuta nelle cose importanti. L'ARP sceglie questa persona."  # TERMDAT 379544
"gratuito patrocinio" = "Lei ha pochi soldi? Allora forse non deve pagare la procedura. Lei può anche ricevere un avvocato o un'avvocata. Il Suo caso deve avere una possibilità di successo."  # TERMDAT 79024
"esame degli atti" = "Lei può leggere gli atti del Suo caso. Gli atti sono tutti i documenti dell'ufficio sul Suo caso."  # TERMDAT 47777
"diritto di essere sentito" = "Prima di una decisione Lei può dare la Sua opinione. L'ufficio deve esaminare la Sua opinione."  # TERMDAT 47696
"spese di procedura" = "Sono le spese dell'ufficio o del tribunale per il Suo caso."  # TERMDAT 383679
"obbligo di collaborare" = "Lei deve aiutare l'ufficio. Per esempio Lei dà tutti i documenti necessari. Altrimenti l'ufficio può ridurre la prestazione."  # TERMDAT 379493
"obbligo di notifica" = "Lei deve comunicare i cambiamenti all'ufficio. Per esempio un nuovo salario o un nuovo indirizzo."
