"decreto d'accusa" = "Un decreto d'accusa è una decisione del procuratore pubblico. Dice: Lei ha commesso un reato. Dice anche la pena. Lei può fare opposizione entro 10 giorni."  # TERMDAT 108682
"procuratore pubblico" = "Il procuratore pubblico lavora per lo Stato. Indaga sui reati. Può anche fare un decreto d'accusa."

[explain.debt]
