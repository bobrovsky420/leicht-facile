[explain.law]
"decisione" = "Una decisione è la risposta di un ufficio o di un tribunale. Vale per Lei. Arriva per lettera."  # TERMDAT 56886
"notifica" = "La notifica è la consegna di una lettera ufficiale. Per esempio di una decisione. Il termine comincia il giorno della notifica."
"notificazione" = "La notificazione è la consegna ufficiale di una decisione. Il termine comincia quel giorno."  # TERMDAT 47814
"intimazione" = "In Ticino l'intimazione è la consegna ufficiale di una decisione. Il termine comincia quel giorno."
"opposizione" = "Lei non è d'accordo con una decisione? Allora Lei scrive allo stesso ufficio. L'ufficio esamina la decisione ancora una volta."  # TERMDAT 47831
"reclamo" = "Lei non è d'accordo con la Sua tassazione? Allora Lei scrive un reclamo all'ufficio delle imposte. L'ufficio esamina la tassazione ancora una volta."  # TERMDAT 55293
"ricorso" = "Lei non è d'accordo con una decisione? Allora Lei scrive a un tribunale o a un altro ufficio. Questo esamina la decisione."  # TERMDAT 37500
"rimedi giuridici" = "Questo testo è alla fine di una decisione. Spiega i Suoi mezzi di difesa. Dice anche il termine e l'indirizzo."  # PA art. 35
"passaggio in giudicato" = "Nessuno può più fare ricorso contro la decisione. La decisione vale ora per sempre."  # TERMDAT 217436
"termine" = "Un termine è il tempo per un compito. Lei deve fare il compito prima della fine del termine."
"proroga" = "Con una proroga Lei riceve più tempo per un compito. Lei la chiede all'ufficio prima della fine del termine."
"domanda" = "Con una domanda Lei chiede qualcosa a un ufficio. Per esempio dei soldi o un permesso."
"avere diritto a" = "Avere diritto a una cosa vuol dire: Lei può ricevere questa cosa. La legge lo dice."
"non entrata nel merito" = "L'ufficio non esamina la Sua domanda. Per esempio mancano dei documenti. Oppure Lei ha mandato la domanda troppo tardi."
"allegato" = "Un allegato è un foglio nella stessa lettera. Per esempio un formulario o una copia."  # TERMDAT 193810
"procura" = "Con una procura un'altra persona può fare qualcosa per Lei. Lei lo permette con la Sua firma."
"legge" = "Una legge è una regola dello Stato. Tutti devono rispettarla."
"tribunale" = "Un tribunale decide in caso di conflitto. Controlla anche le decisioni degli uffici."
"segreto professionale" = "Il medico tiene per sé le Sue informazioni. Non le dice ad altre persone. Questo è il segreto professionale."
