"caso di rigore" = "La Sua situazione è molto difficile. Per questo l'ufficio fa un'eccezione alla regola."  # TERMDAT 386670
"capacità di discernimento" = "Lei capisce una situazione. Lei può decidere in modo ragionevole. Allora Lei ha la capacità di discernimento."  # TERMDAT 379558
