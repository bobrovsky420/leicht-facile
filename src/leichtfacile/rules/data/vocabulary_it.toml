"diffida" = "Una diffida è una lettera severa. Lei deve pagare ora. Altrimenti seguono altre misure."  # TERMDAT 108601
"esecuzione" = "Lei ha dei debiti. Con un'esecuzione qualcuno recupera questi soldi. L'ufficio di esecuzione aiuta in questo."  # TERMDAT 86779
"ufficio di esecuzione" = "L'ufficio di esecuzione recupera i soldi dei debiti. Poi dà questi soldi alla persona giusta."  # TERMDAT 38822
