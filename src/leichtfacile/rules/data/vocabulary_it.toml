"ricovero a scopo di assistenza" = "Una persona deve andare in una clinica contro la sua volontà. È una misura di protezione. Un medico o l'ARP decide questo."  # TERMDAT 379534
"effetto sospensivo" = "Lei fa ricorso contro una decisione. Fino alla nuova decisione la vecchia decisione non vale ancora. A volte l'ufficio toglie l'effetto sospensivo. Allora la decisione vale subito."  # PA art. 55
