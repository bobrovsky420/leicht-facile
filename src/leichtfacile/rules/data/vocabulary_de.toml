# German vocabulary for easy language (Leichte Sprache A2, Einfache Sprache B1): the
# entries the German varieties share, right in Switzerland, Germany and Austria alike.
# Each variety reads this file and its own: vocabulary_de-CH.toml (the Swiss key de),
# vocabulary_de-DE.toml and vocabulary_de-AT.toml. Written for this project; checked by
# tests/rules/test_vocabulary.py.
#
# [replace.<group>]  hard word = everyday word to use instead. A suggestion for the
#                    writer and the checker, not a blind substitution: case and word
#                    order may change ("innert 30 Tagen" -> "innerhalb von 30 Tagen").
# [explain.<group>]  a term that has to stay, because the reader meets it again on
#                    forms, letters and the phone = a plain explanation for the
#                    glossary, in short sentences that pass the checker.
# [<kind>.context]   words with a second, everyday sense: the writer gets them as a
#                    hint, code never flags or adds them on its own.
# [not_in]           phrases in which a term of the same file does not count
#                    (in Abstimmung mit).
#
# A trailing "# TERMDAT <id>" names the entry of the federal terminology database
# (www.termdat.bk.admin.ch/entry/<id>) that confirms the official term.
# Terms TERMDAT lacks name the act that defines them instead ("# ELG Art. 11"); the
# entries of Germany and Austria cite their own acts ("# SGB II § 7", "# AVG § 58").
#
# An entry stands here only when its term, its everyday word and its explanation read
# correctly in all three countries: no Kanton, Franken, AHV, IV or Betreibung, no Swiss
# procedure (Entscheid, Einsprache), no word of one or two countries only (innert,
# allfällig, Spital), and no word that means different things in two of them
# (Beschwerde, Beistand, Zustellung). Those stand in the country files, a term in at
# most one file of a variety.
#
# Base forms: nouns in the singular, verbs in the infinitive. No Mediopunkt (code
# adds it, rules/mediopunkt.py). Every German file is written in the Swiss spelling:
# ss, never sharp s; for Germany and Austria the loader writes sharp s where
# rules/data/spelling_de.toml says so (gemäss: gemäß).

