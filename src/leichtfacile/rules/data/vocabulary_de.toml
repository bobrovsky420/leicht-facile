# -- explain -----------------------------------------------------------------------

[explain.law]
"Verfügung" = "Eine Verfügung ist ein Entscheid von einem Amt. Der Entscheid steht in einem Brief. Er gilt für Sie."
"Entscheid" = "Ein Entscheid ist die Antwort von einem Amt oder Gericht. Er sagt: Das gilt in Ihrer Sache."
"Eröffnung" = "Eröffnung heisst hier: Das Amt gibt Ihnen den Entscheid. Ab diesem Tag läuft die Frist."
"Einsprache" = "Sie sind mit einem Entscheid nicht einverstanden? Dann schreiben Sie dem gleichen Amt. Das Amt prüft den Entscheid noch einmal."
"Beschwerde" = "Sie sind mit einem Entscheid nicht einverstanden? Dann schreiben Sie an eine höhere Stelle, zum Beispiel an ein Gericht. Diese Stelle prüft den Entscheid."
"Rekurs" = "Ein Rekurs ist eine Beschwerde gegen einen Entscheid. Manche Kantone sagen Rekurs. Andere Kantone sagen Beschwerde."
"Rechtsmittel" = "Mit einem Rechtsmittel wehren Sie sich gegen einen Entscheid. Zum Beispiel mit einer Einsprache. Oder mit einer Beschwerde."
"Rechtsmittelbelehrung" = "Dieser Text steht am Ende von einem Entscheid. Er sagt: So können Sie sich wehren. Er sagt auch, bis wann und bei wem."
"rechtskräftig" = "Gegen den Entscheid kann sich niemand mehr wehren. Der Entscheid gilt jetzt endgültig."
"Frist" = "Eine Frist ist die Zeit für eine Aufgabe. Bis zum letzten Tag von der Frist müssen Sie etwas tun."
"Fristerstreckung" = "Sie bekommen mehr Zeit für eine Aufgabe. Fragen Sie das Amt vor dem Ende von der Frist."
"Gesuch" = "Mit einem Gesuch bitten Sie ein Amt um etwas. Zum Beispiel um Geld oder um eine Erlaubnis."
"Anspruch" = "Sie haben einen Anspruch heisst: Sie haben ein Recht darauf. Zum Beispiel auf Geld."
"Nichteintreten" = "Das Amt prüft Ihr Gesuch nicht. Zum Beispiel fehlen Papiere. Oder die Frist ist vorbei."
"Beilage" = "Eine Beilage ist ein Blatt im gleichen Brief. Zum Beispiel ein Formular oder eine Kopie."
"Vollmacht" = "Mit einer Vollmacht erlauben Sie einer anderen Person: Sie darf etwas für Sie erledigen."
"Gesetz" = "Ein Gesetz ist eine Regel vom Staat. Alle müssen sich daran halten."
