"Rente" = "Eine Rente ist Geld für jeden Monat. Sie bekommen es zum Beispiel im Alter. Oder bei einer Behinderung."
"AHV" = "Die AHV ist eine Versicherung. Sie bezahlt eine Rente im Alter. Sie hilft auch der Familie nach einem Todesfall."
"IV" = "Die IV ist eine Versicherung. Sie ist für Menschen mit Behinderung oder langer Krankheit. Sie hilft zum Beispiel bei der Arbeit. Oder sie bezahlt eine Rente."
"Ergänzungsleistungen" = "Ergänzungsleistungen sind Geld vom Staat. Sie kommen zur AHV-Rente oder IV-Rente dazu. Die Rente reicht nicht zum Leben? Dann bekommen Sie Ergänzungsleistungen."
"Hilflosenentschädigung" = "Dieses Geld ist für Menschen mit viel Hilfe im Alltag. Sie brauchen zum Beispiel Hilfe bei der Körperpflege."
"Assistenzbeitrag" = "Geld von der IV. Damit können Sie eine Person anstellen. Diese Person hilft Ihnen zu Hause."
"Taggeld" = "Taggeld ist Geld für jeden Tag ohne Arbeit. Zum Beispiel bei Krankheit oder nach einem Unfall."
"Kostengutsprache" = "Eine Stelle sagt Ihnen schriftlich: Wir bezahlen diese Kosten. Sie sagt es vor der Behandlung."
"Hilfsmittel" = "Hilfsmittel sind Dinge für Menschen mit Behinderung. Sie helfen im Alltag. Zum Beispiel ein Rollstuhl oder ein Hörgerät."
"Pensionskasse" = "Die Pensionskasse spart Geld für Ihr Alter. Sie und Ihr Arbeitgeber zahlen jeden Monat etwas vom Lohn ein."
"Säule 3a" = "Die Säule 3a ist ein Konto für das Alter. Darauf sparen Sie Geld. Für dieses Geld zahlen Sie weniger Steuern. Meistens bekommen Sie es erst kurz vor der Pension."
"Arbeitslosenversicherung" = "Sie haben Ihre Arbeit verloren? Dann zahlt die Arbeitslosenversicherung Ihnen Geld. Sie hilft auch bei der Suche nach Arbeit."
"RAV" = "Das RAV ist ein Amt. Es hilft Menschen ohne Arbeit bei der Suche nach einer Stelle."
"Unfallversicherung" = "Die Unfallversicherung bezahlt Kosten nach einem Unfall. Zum Beispiel den Arzt. Sie zahlt auch Geld für die Zeit ohne Arbeit."
"Leistungserbringer" = "Leistungserbringer behandeln Sie. Zum Beispiel eine Ärztin oder ein Spital. Sie schicken die Rechnung an Sie oder an die Krankenkasse."  # TERMDAT 37415
"Hausarztmodell" = "Bei Gesundheitsproblemen gehen Sie zuerst zu Ihrer Hausärztin oder Ihrem Hausarzt. Dafür bezahlen Sie eine tiefere Prämie."  # TERMDAT 37543
"Versicherungspflicht" = "Sie müssen eine Versicherung haben. Das verlangt das Gesetz. Für die Krankenkasse gilt das für alle in der Schweiz."  # TERMDAT 37640
"Generikum" = "Ein Generikum ist ein günstigeres Medikament. Es wirkt gleich wie das Original."  # TERMDAT 37534
"Suva" = "Die Suva ist eine grosse Unfallversicherung. Viele Arbeitgeber versichern ihre Angestellten bei der Suva."  # TERMDAT 3042
"Wartezeit" = "Wartezeit heisst hier: Die Versicherung zahlt erst nach einigen Tagen. Diese Tage müssen Sie warten."  # TERMDAT 56382
"Arbeitsunfähigkeit" = "Sie können wegen Krankheit oder Unfall nicht arbeiten. Oder Sie können nur weniger arbeiten."  # TERMDAT 37485
"Erwerbsunfähigkeit" = "Sie können wegen Ihrer Gesundheit nicht mehr genug verdienen. Das gilt für lange Zeit."  # TERMDAT 37525
"Invaliditätsgrad" = "Der Invaliditätsgrad ist eine Zahl in Prozent. Sie zeigt: So viel Lohn verlieren Sie wegen Ihrer Gesundheit. Davon hängt die IV-Rente ab."  # TERMDAT 294549
"berufliche Eingliederung" = "Die IV hilft Ihnen bei der Rückkehr in die Arbeit. Zum Beispiel mit einem Kurs. Oder mit einer neuen Ausbildung."  # TERMDAT 89634
"Einspracheentscheid" = "Das Amt hat Ihre Einsprache geprüft. Der Einspracheentscheid ist seine Antwort darauf."  # TERMDAT 37518
"Arbeitslosenentschädigung" = "Sie haben keine Arbeit mehr? Dann bekommen Sie dieses Geld von der Arbeitslosenversicherung."  # TERMDAT 525519
"Einstelltage" = "An Einstelltagen bekommen Sie kein Geld von der Arbeitslosenversicherung. Das ist eine Strafe. Zum Beispiel bei zu wenig Bewerbungen."  # TERMDAT 525599
"zumutbare Arbeit" = "Diese Arbeit passt zu Ihnen. Sie müssen sie annehmen. Sonst bekommen Sie weniger Geld von der Arbeitslosenversicherung."  # TERMDAT 6551
"Rahmenfrist" = "Die Rahmenfrist ist eine Zeit von 2 Jahren. Nur in dieser Zeit bekommen Sie Geld von der Arbeitslosenversicherung."  # TERMDAT 525720
"Beitragslücke" = "In einem Jahr fehlen Ihre Beiträge an die AHV. Später bekommen Sie darum eine kleinere Rente."  # TERMDAT 444051
"Mutterschaftsentschädigung" = "Geld für Mütter nach der Geburt. Sie bekommen es 14 Wochen lang. Das gilt für Mütter mit Arbeit."  # TERMDAT 93386
"Familienzulage" = "Geld für Familien mit Kindern. Sie bekommen es meistens mit dem Lohn."  # TERMDAT 41628
"Kinderzulage" = "Geld für jedes Kind bis 16 Jahre. Es ist eine Familienzulage."  # TERMDAT 6614
"Ausbildungszulage" = "Geld für jedes Kind in Ausbildung. Das gibt es von 16 bis 25 Jahren."  # TERMDAT 93630
"anrechenbare Einnahmen" = "Dieses Geld zählt das Amt für die Ergänzungsleistungen. Zum Beispiel Ihre Rente oder Ihr Lohn."  # ELG Art. 11
"anerkannte Ausgaben" = "Diese Kosten zählt das Amt für die Ergänzungsleistungen. Zum Beispiel die Miete oder die Prämie für die Krankenkasse."  # ELG Art. 10
"Vermögensverzehr" = "Sie sollen auch von Ihrem Vermögen leben. Darum zählt das Amt jedes Jahr einen Teil davon als Einnahme."  # ELG Art. 11
"Verzichtsvermögen" = "Sie haben Vermögen verschenkt. Oder Sie haben es zu billig verkauft. Das Amt zählt dieses Vermögen trotzdem."  # ELG Art. 11a
"Durchschnittsprämie" = "Das ist die mittlere Prämie für die Krankenkasse in Ihrem Kanton. Das Amt rechnet mit dieser Prämie."  # ELG Art. 10
"Prämienregion" = "Die Prämie für die Krankenkasse hängt von Ihrem Wohnort ab. Ein Kanton hat bis zu 3 Prämienregionen."  # KVG Art. 61
"Richtprämie" = "Mit der Richtprämie berechnet der Kanton die Prämienverbilligung. Sie ist ein fester Betrag pro Person."  # kantonal, zum Beispiel Zürich
"Sozialversicherung" = "Sozialversicherungen helfen bei Krankheit oder Unfall. Sie helfen auch im Alter und ohne Arbeit. Zum Beispiel die AHV oder die IV."
"Beitrag" = "Ein Beitrag ist Geld für eine Versicherung. Zum Beispiel für die AHV. Bei Angestellten zieht der Arbeitgeber ihn vom Lohn ab."
"Lebensbedarf" = "Geld für den Alltag bei den Ergänzungsleistungen. Zum Beispiel für Essen und Kleider. Das Gesetz legt den Betrag fest."
"Freibetrag" = "Bis zu diesem Betrag zählt das Amt Ihr Geld nicht. Zum Beispiel einen Teil von Ihrem Vermögen."
"Entschädigung" = "Eine Entschädigung ist Geld als Ausgleich. Zum Beispiel für einen Schaden oder einen Verlust."

[explain.health]
"ambulant" = "Ambulant heisst: Sie gehen nach der Behandlung am gleichen Tag nach Hause."
"stationär" = "Stationär heisst: Sie bleiben für die Behandlung über Nacht im Spital."
"Spitex" = "Fachleute von der Spitex kommen zu Ihnen nach Hause. Sie helfen bei der Pflege oder im Haushalt."
"Arztzeugnis" = "Ein Papier vom Arzt oder von der Ärztin. Darin steht: Sie sind krank und können nicht arbeiten."
"Bedarfsabklärung" = "Eine Fachperson prüft Ihre Lage. Danach weiss sie: Diese Hilfe brauchen Sie."
"Opferhilfe" = "Die Opferhilfe hilft Menschen nach Gewalt. Die Beratung ist gratis. Die Fachleute erzählen nichts weiter."
"Gebärdensprache" = "Eine Sprache mit den Händen und dem Gesicht. Viele gehörlose Menschen sprechen sie."
"barrierefrei" = "Barrierefrei heisst: Alle Menschen können es gut benutzen. Auch Menschen mit einer Behinderung."

[explain.social]
"Sozialhilfe" = "Die Sozialhilfe ist Geld vom Staat. Sie ist für Menschen mit zu wenig Geld zum Leben."
"Sozialdienst" = "Der Sozialdienst ist ein Amt in der Gemeinde. Er hilft Menschen in einer schwierigen Lage. Zum Beispiel mit Geld oder mit Beratung."
"Lohnausweis" = "Ein Papier vom Arbeitgeber. Darauf steht Ihr Lohn für ein ganzes Jahr. Sie brauchen es für die Steuererklärung."
"Kündigungsfrist" = "Die Zeit zwischen der Kündigung und dem Ende vom Vertrag."
"Probezeit" = "Die ersten Wochen an einer neuen Stelle. In dieser Zeit können beide Seiten schneller kündigen."
"Nebenkosten" = "Kosten für die Wohnung, zusätzlich zur Miete. Zum Beispiel für Heizung und Wasser."
"Mietzinsdepot" = "Geld als Sicherheit für den Vermieter. Es liegt auf einem besonderen Konto bei der Bank. Nach dem Auszug bekommen Sie es zurück."
"Hausverwaltung" = "Die Hausverwaltung kümmert sich für den Besitzer um ein Haus. Sie ist auch für die Mieter da."
"Sorgerecht" = "Die Eltern mit dem Sorgerecht entscheiden über wichtige Sachen für das Kind. Zum Beispiel über die Schule und die Gesundheit."
"Obhut" = "Das Kind wohnt bei Ihnen. Sie sorgen jeden Tag für das Kind."
"Unterhaltsbeitrag" = "Geld für den Lebensunterhalt von einem Kind oder von einem früheren Ehepartner. Eine Person bezahlt es regelmässig an die andere."
"Zivilstand" = "Der Zivilstand sagt zum Beispiel: Sie sind verheiratet. Oder: Sie sind ledig."
"verwitwet" = "Verwitwet heisst: Ihr Ehemann oder Ihre Ehefrau ist gestorben."
"Stipendium" = "Geld vom Kanton für eine Ausbildung. Sie müssen es nicht zurückzahlen."  # TERMDAT 56159
"Ausbildungsbeitrag" = "Geld vom Kanton für eine Ausbildung. Das kann ein Stipendium sein. Oder ein Darlehen. Ein Darlehen zahlen Sie später zurück."  # TERMDAT 385216
"Konkubinat" = "2 Personen wohnen als Paar zusammen. Sie sind aber nicht verheiratet."  # TERMDAT 216966
"Unterhaltspflicht" = "Sie müssen für den Unterhalt von einer anderen Person zahlen. Zum Beispiel Eltern für ihre Kinder."  # TERMDAT 56279
"Mietzinsmaximum" = "So viel Miete zählt das Amt höchstens. Ist Ihre Wohnung teurer? Dann bezahlen Sie den Rest selbst."  # TERMDAT 385470
"Grundbedarf" = "Geld für den Alltag in der Sozialhilfe. Zum Beispiel für Essen und Kleider. Der Betrag hängt von der Grösse vom Haushalt ab."  # SKOS-Richtlinien
"Unterstützungseinheit" = "Dazu gehören die Personen in Ihrem Haushalt mit Pflichten füreinander. Zum Beispiel Eltern und ihre Kinder. Die Sozialhilfe rechnet für sie zusammen."  # SKOS-Richtlinien
"Alimentenbevorschussung" = "Ein Elternteil zahlt den Unterhalt für das Kind nicht. Dann zahlt die Gemeinde oder der Kanton vorläufig. Danach holt das Amt das Geld beim anderen Elternteil."  # ZGB Art. 293, kantonal
"Nettomiete" = "Die Nettomiete ist die Miete ohne Nebenkosten."
"Bruttomiete" = "Die Bruttomiete ist die Miete mit den Nebenkosten."

[explain.tax]
"Steuererklärung" = "Ein Formular für die Steuern. Darin schreiben Sie Ihr Einkommen auf. Sie schreiben auch Ihr Vermögen auf."
"Veranlagung" = "Das Steueramt berechnet Ihre Steuern. Das Ergebnis heisst Veranlagung. Sie bekommen es als Brief."
"provisorische Rechnung" = "Eine erste Rechnung für die Steuern. Die genaue Rechnung kommt später."
"Quellensteuer" = "Der Arbeitgeber zieht die Steuern direkt vom Lohn ab. Das gilt zum Beispiel für Menschen mit Ausweis B."
"Abzug" = "Ein Abzug ist ein Betrag. Sie dürfen ihn vom Einkommen abziehen. Dann bezahlen Sie weniger Steuern."
"steuerbares Einkommen" = "Ihr Einkommen nach allen Abzügen. Davon berechnet das Steueramt die Steuern."
"massgebendes Einkommen" = "Dieses Einkommen zählt für einen Entscheid. Das Amt berechnet es nach eigenen Regeln."
"Vermögen" = "Zum Vermögen gehören alle Ihre Sachen mit Geldwert. Zum Beispiel Geld auf dem Konto oder ein Haus."
"steuerpflichtig" = "Steuerpflichtig heisst: Sie müssen Steuern bezahlen."
"Steuererlass" = "Sie können Ihre Steuern wegen einer Notlage nicht bezahlen. Dann kann das Amt Ihnen die Steuern ganz oder zum Teil schenken."  # TERMDAT 97116
"Zahlungserleichterung" = "Sie dürfen später oder in Teilen bezahlen. Das Amt muss zustimmen."  # kantonale Steuergesetze
"Steuerperiode" = "Das Jahr für Ihre Steuern. Meistens vom 1. Januar bis 31. Dezember."  # DBG Art. 40
"Schlussrechnung" = "Die letzte genaue Rechnung für ein Steuerjahr. Vorher haben Sie vielleicht schon provisorische Rechnungen bezahlt."  # kantonale Steuergesetze
"Nachsteuer" = "Sie haben nicht alles Einkommen oder Vermögen angegeben. Darum verlangt das Steueramt Steuern für frühere Jahre nach."
"Ermessensveranlagung" = "Sie haben keine Steuererklärung abgegeben. Dann schätzt das Steueramt Ihr Einkommen und Ihr Vermögen."

[explain.residence]
"Aufenthaltsbewilligung" = "Sie dürfen für eine bestimmte Zeit in der Schweiz wohnen. Dann müssen Sie die Erlaubnis verlängern. Das ist der Ausweis B."
"Niederlassungsbewilligung" = "Sie dürfen ohne Zeitgrenze in der Schweiz wohnen. Das ist der Ausweis C."
"Einwohnerkontrolle" = "Ein Amt in der Gemeinde. Dort melden Sie Ihre Adresse. Zum Beispiel nach einem Umzug."
"Zivilstandsamt" = "Dieses Amt schreibt wichtige Daten in ein Register. Zum Beispiel eine Geburt oder eine Heirat."
"Einbürgerung" = "Sie werden Schweizer Bürgerin oder Schweizer Bürger. Dann bekommen Sie den Schweizer Pass."
"Heimatort" = "Ihre Familie hat an diesem Ort das Bürgerrecht. Der Heimatort steht im Pass. Oft wohnen Sie an einem anderen Ort."
"vorläufige Aufnahme" = "Sie dürfen vorläufig in der Schweiz bleiben. Eine Rückkehr in Ihr Land ist im Moment nicht möglich. Das ist der Ausweis F."  # TERMDAT 38432
"Schutzstatus S" = "Sie sind vor einem Krieg geflüchtet. Die Schweiz schützt Sie für eine bestimmte Zeit. Das ist der Ausweis S."  # TERMDAT 500839
"Familiennachzug" = "Ihre Familie kommt aus dem Ausland zu Ihnen in die Schweiz. Dafür brauchen Sie eine Erlaubnis."  # TERMDAT 37788

[explain.vote]
"Abstimmung" = "Bei einer Abstimmung sagen die Stimmberechtigten Ja oder Nein zu einer Frage."
"Stimmrecht" = "Sie dürfen bei Abstimmungen und Wahlen mitmachen. Meistens haben das Erwachsene mit Schweizer Pass."
"stimmberechtigt" = "Stimmberechtigt heisst: Sie haben das Stimmrecht."
"Volksinitiative" = "Menschen sammeln Unterschriften für eine neue Regel in der Verfassung. Mit genug Unterschriften gibt es eine Abstimmung."
"Referendum" = "Menschen sammeln Unterschriften gegen ein neues Gesetz. Mit genug Unterschriften stimmt das Volk darüber ab."
"Gegenvorschlag" = "Ein anderer Vorschlag vom Parlament oder von der Regierung. Er kommt als Antwort auf eine Volksinitiative."
"Stimmrechtsausweis" = "Diese Karte kommt mit den Papieren für die Abstimmung. Sie unterschreiben die Karte und schicken sie mit. Nur dann zählt Ihre Stimme."
"Urne" = "Die Urne ist eine Box für die Stimmzettel. An die Urne gehen heisst: im Wahllokal abstimmen."
"Kantonsrat" = "Der Kantonsrat ist das Parlament vom Kanton. Er macht die Gesetze für den Kanton. Manche Kantone sagen Grosser Rat."
"Regierungsrat" = "Der Regierungsrat ist die Regierung vom Kanton. Er hat 5 oder 7 Mitglieder."
"Gemeindeversammlung" = "An der Gemeindeversammlung treffen sich die Stimmberechtigten. Sie entscheiden zusammen über Fragen in der Gemeinde."
"Vernehmlassung" = "Vor einem neuen Gesetz fragt die Regierung viele Gruppen nach ihrer Meinung. Das heisst Vernehmlassung."
"Verfassung" = "Die Verfassung ist das wichtigste Gesetz vom Land oder vom Kanton. Darin stehen die Grundregeln und Ihre Rechte."
