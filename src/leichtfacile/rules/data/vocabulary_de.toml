# -- explain -----------------------------------------------------------------------

[explain.law]
"Frist" = "Eine Frist ist die Zeit für eine Aufgabe. Bis zum letzten Tag von der Frist müssen Sie etwas tun."
"Gesuch" = "Mit einem Gesuch bitten Sie ein Amt oder eine Schule um etwas. Zum Beispiel um Geld oder um eine Erlaubnis."
"Anspruch" = "Sie haben einen Anspruch heisst: Sie haben ein Recht darauf. Zum Beispiel auf Geld."
"Beilage" = "Eine Beilage ist ein Blatt im gleichen Brief. Zum Beispiel ein Formular oder eine Kopie."
"Vollmacht" = "Mit einer Vollmacht erlauben Sie einer anderen Person: Sie darf etwas für Sie erledigen."
"Gesetz" = "Ein Gesetz ist eine Regel vom Staat. Alle müssen sich daran halten."
"Datenschutz" = "Datenschutz heisst: Ihre Daten sind geschützt. Nur bestimmte Personen dürfen sie sehen."
"Schweigepflicht" = "Fachleute dürfen anderen nichts über Sie erzählen. Das ist die Schweigepflicht."
"Akteneinsicht" = "Sie dürfen die Akten zu Ihrer Sache lesen. Akten sind alle Papiere vom Amt zu Ihrer Sache."  # TERMDAT 47777
"Mitwirkungspflicht" = "Sie müssen dem Amt helfen. Zum Beispiel geben Sie alle nötigen Papiere ab. Sonst kann das Amt die Leistung kürzen."  # TERMDAT 379493
"Meldepflicht" = "Sie müssen dem Amt Änderungen melden. Zum Beispiel einen neuen Lohn oder eine neue Adresse."
"Rückerstattungspflicht" = "Sie haben zu viel Geld bekommen. Dann müssen Sie es zurückzahlen."  # TERMDAT 37961
"Härtefall" = "Ihre Lage ist sehr schwierig. Darum macht das Amt eine Ausnahme von der Regel."  # TERMDAT 386670
"gesetzliche Vertretung" = "Eine Person handelt für Sie. Das Gesetz erlaubt ihr das. Zum Beispiel die Eltern für ihr Kind."  # TERMDAT 47787
"Patientenverfügung" = "Sie schreiben Ihre Wünsche für eine medizinische Behandlung auf. Später können Sie vielleicht nicht mehr selbst entscheiden. Dann halten sich die Ärzte an Ihre Wünsche."  # TERMDAT 379518
"Rückforderung" = "Sie haben zu viel Geld bekommen. Das Amt verlangt dieses Geld zurück."  # ATSG Art. 25
"Weisung" = "Eine Weisung ist eine Anweisung vom Amt. Sie müssen sich daran halten. Sonst kann das Amt die Leistung kürzen."
"Verjährung" = "Nach einer bestimmten Zeit kann niemand mehr eine Schuld verlangen. Das ist die Verjährung."
"Vorinstanz" = "Die Vorinstanz hat vorher in Ihrer Sache entschieden. Zum Beispiel ein Amt vor dem Gericht."
"Merkblatt" = "Ein Merkblatt ist ein Blatt mit wichtigen Informationen zu einem Thema."

[explain.debt]
"Mahnung" = "Eine Mahnung ist ein Brief. Darin steht: Sie haben eine Rechnung noch nicht bezahlt. Bitte bezahlen Sie jetzt."
"Inkasso" = "Eine Inkasso-Firma holt Geld für andere Firmen. Sie haben bei diesen Firmen Schulden."
"Schuldenberatung" = "Fachleute helfen Ihnen bei Schulden. Sie machen mit Ihnen einen Plan."
"Verrechnung" = "Das Amt zieht Ihre Schulden vom Geld für Sie ab. Sie bekommen nur den Rest."  # TERMDAT 97006
"Verzugszins" = "Sie bezahlen eine Rechnung zu spät. Dann kostet es mehr. Dieses zusätzliche Geld heisst Verzugszins."  # TERMDAT 43049
"Stundung" = "Sie dürfen eine Schuld später bezahlen. Das Amt gibt Ihnen dafür mehr Zeit."
"IBAN" = "Die IBAN ist die Nummer von Ihrem Bankkonto. Ihre Bank gibt Ihnen diese Nummer."

[explain.insurance]
"Prämie" = "Die Prämie ist das Geld für eine Versicherung. Sie bezahlen es regelmässig, zum Beispiel jeden Monat."
"Rente" = "Eine Rente ist Geld für jeden Monat. Sie bekommen es zum Beispiel im Alter. Oder bei einer Behinderung."
"Hilfsmittel" = "Hilfsmittel sind Dinge für Menschen mit Behinderung. Sie helfen im Alltag. Zum Beispiel ein Rollstuhl oder ein Hörgerät."
"Arbeitslosenversicherung" = "Sie haben Ihre Arbeit verloren? Dann zahlt die Arbeitslosenversicherung Ihnen Geld. Sie hilft auch bei der Suche nach Arbeit."
"Unfallversicherung" = "Die Unfallversicherung bezahlt Kosten nach einem Unfall. Zum Beispiel den Arzt. Angestellte können nach dem Unfall nicht arbeiten? Dann bekommen sie von ihr auch Geld."
"Haftpflichtversicherung" = "Sie oder Ihr Kind machen bei anderen Personen etwas kaputt? Dann bezahlt die Haftpflichtversicherung den Schaden."
"Generikum" = "Ein Generikum ist ein günstigeres Medikament. Es wirkt gleich wie das Original."  # TERMDAT 37534
"Arbeitsunfähigkeit" = "Sie können wegen Krankheit oder Unfall nicht arbeiten. Oder Sie können nur weniger arbeiten."  # TERMDAT 37485
"Erwerbsunfähigkeit" = "Sie können wegen Ihrer Gesundheit nicht mehr genug verdienen. Das gilt für lange Zeit."  # TERMDAT 37525
"zumutbare Arbeit" = "Diese Arbeit passt zu Ihnen. Sie müssen sie annehmen. Sonst bekommen Sie weniger Geld von der Arbeitslosenversicherung."  # TERMDAT 6551
"Freibetrag" = "Bis zu diesem Betrag zählt das Amt Ihr Geld nicht. Zum Beispiel einen Teil von Ihrem Vermögen."
"Entschädigung" = "Eine Entschädigung ist Geld als Ausgleich. Zum Beispiel für einen Schaden oder einen Verlust."

[explain.health]
"ambulant" = "Ambulant heisst: Sie gehen nach der Behandlung am gleichen Tag nach Hause."
"Opferhilfe" = "Die Opferhilfe hilft Menschen nach Gewalt. Die Beratung ist gratis. Die Fachleute erzählen nichts weiter."
"Gebärdensprache" = "Eine Sprache mit den Händen und dem Gesicht. Viele gehörlose Menschen sprechen sie."
"barrierefrei" = "Barrierefrei heisst: Alle Menschen können es gut benutzen. Auch Menschen mit einer Behinderung."

[explain.social]
"Sozialhilfe" = "Die Sozialhilfe ist Geld vom Staat. Sie ist für Menschen mit zu wenig Geld zum Leben."
"Kündigungsfrist" = "Die Zeit zwischen der Kündigung und dem Ende vom Vertrag."
"Probezeit" = "Die ersten Wochen an einer neuen Stelle. In dieser Zeit können beide Seiten schneller kündigen."
"Nebenkosten" = "Kosten für die Wohnung, zusätzlich zur Miete. Zum Beispiel für Heizung und Wasser."
"Hausverwaltung" = "Die Hausverwaltung kümmert sich für den Besitzer um ein Haus. Sie ist auch für die Mieter da."
"Sorgerecht" = "Die Eltern mit dem Sorgerecht entscheiden über wichtige Sachen für das Kind. Zum Beispiel über die Schule und die Gesundheit."
"Obhut" = "Das Kind wohnt bei Ihnen. Sie sorgen jeden Tag für das Kind."
"Unterhaltsbeitrag" = "Geld für den Lebensunterhalt von einem Kind oder von einem früheren Ehepartner. Eine Person bezahlt es regelmässig an die andere."
"verwitwet" = "Verwitwet heisst: Ihr Ehemann oder Ihre Ehefrau ist gestorben."
"Unterhaltspflicht" = "Sie müssen für den Unterhalt von einer anderen Person zahlen. Zum Beispiel Eltern für ihre Kinder."  # TERMDAT 56279
"Nettomiete" = "Die Nettomiete ist die Miete ohne Nebenkosten."
"Bruttomiete" = "Die Bruttomiete ist die Miete mit den Nebenkosten."

[explain.tax]
"Abzug" = "Ein Abzug ist ein Betrag. Sie dürfen ihn vom Einkommen abziehen. Dann bezahlen Sie weniger Steuern."
"Vermögen" = "Zum Vermögen gehören alle Ihre Sachen mit Geldwert. Zum Beispiel Geld auf dem Konto oder ein Haus."
"steuerpflichtig" = "Steuerpflichtig heisst: Sie müssen Steuern bezahlen."
"Steuererlass" = "Sie können Ihre Steuern wegen einer Notlage nicht bezahlen. Dann kann das Amt Ihnen die Steuern ganz oder zum Teil schenken."  # TERMDAT 97116
"Zahlungserleichterung" = "Sie dürfen später oder in Teilen bezahlen. Das Amt muss zustimmen."  # kantonale Steuergesetze
