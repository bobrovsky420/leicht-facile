"Urne" = "Die Urne ist eine Box für die Stimmzettel. An die Urne gehen heisst: im Wahllokal abstimmen."

# School letters to parents and students (docs/use-cases.md section 8): the
# explanations address nobody, since the reader is a parent (Sie) or a student (du).
[explain.school]
"Elternabend" = "Am Elternabend treffen sich die Eltern mit der Lehrerin oder dem Lehrer. Sie bekommen Informationen zur Klasse und zum Schuljahr."
"Schulleitung" = "Die Schulleitung leitet die Schule. Sie ist die Chefin oder der Chef von allen Lehrerinnen und Lehrern."
"Zeugnis" = "Ein Zeugnis ist ein Papier von der Schule. Darin stehen die Noten vom Kind. Das Kind bekommt es am Ende vom Schuljahr oder vom Halbjahr."
"DaZ" = "DaZ heisst Deutsch als Zweitsprache. Das ist Unterricht für Kinder mit wenig Deutsch. Dort lernen sie Deutsch."

[explain.context]
# Terms with a second, everyday sense (Leistung in a school report, Forderung
# of a trade union). Kept for the writer and the termbase; code never adds them.
"Leistung" = "Eine Leistung bekommen Sie von einer Versicherung oder einem Amt. Das kann Geld sein oder Hilfe."
"Forderung" = "Eine Forderung ist Geld. Jemand verlangt dieses Geld von Ihnen."
"Verordnung" = "Eine Verordnung ist eine Sammlung von Regeln. Die Regierung macht sie. Sie erklärt ein Gesetz genauer."

# -- not in ------------------------------------------------------------------------

# Phrases in which a term does not mean what the vocabulary explains:
# in Abstimmung mit is no vote.
[not_in]
"Abstimmung" = ["in Abstimmung mit", "Abstimmung mit"]
