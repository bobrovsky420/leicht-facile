# The French value grammar: the words and formats rules/values.py reads values with
# (docs/rules.md, "Value kinds"; rules/value_grammar.py reads this file; values_de.toml
# explains every key). Swiss French: the thousands take an apostrophe or a space, the
# decimals a point or a comma, the amounts are francs.

[dates]
month_names = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
               "septembre", "octobre", "novembre", "décembre"]
abbreviations = []
# A plain day (4 février 2026); the first is written 1er.
day = "{day}"
first_day = "1er"
# du 7 au 11 juin 2027, les 1er et 2 juin
range_words = ["au", "et"]

[dates.months]
janvier = 1
"février" = 2
fevrier = 2
mars = 3
avril = 4
mai = 5
juin = 6
juillet = 7
"août" = 8
aout = 8
septembre = 9
octobre = 10
novembre = 11
"décembre" = 12
decembre = 12

[time]
clock_word = ""
# 9 h 00, 9h30, 9h
hour_letter = true
prefix_words = []
bare_hour_words = []
range_words = []
range_before = []
range_between = []

[percent]
words = ["pour cent", "pourcent"]

[currency]
before = ["CHF", "Fr.", "SFr.", "sFr.", "EUR", "€"]
after = ["CHF", "Fr.", "francs", "franc", "EUR", "euros", "euro", "€"]
# 2 millions de francs
link_words = ["de"]
# A French cent is a hundred, not a hundredth.
subunits = ["centimes", "centime"]
weekday_abbreviations = []
weekday_joiners = []

[currency.multipliers]
"million" = 1000000
"millions" = 1000000
"Mio." = 1000000
"Mio" = 1000000
"milliard" = 1000000000
"milliards" = 1000000000
"Mrd." = 1000000000
"Mrd" = 1000000000

[numbers]
thousands = ["'", "’", "ʼ", " ", "\u00a0", "\u202f", "\u2009"]
decimal = [".", ","]
dot_decimals = false
# Written back with a space: 1 500 francs.
writes_thousands = " "
writes_decimal = "."

[number_words]
# vingt-cinq, quatre-vingt-onze; vingt et un
compound = "hyphen"
and_word = "et"

[number_words.table]
un = 1
une = 1
deux = 2
trois = 3
quatre = 4
cinq = 5
six = 6
sept = 7
huit = 8
neuf = 9
dix = 10
onze = 11
douze = 12
treize = 13
quatorze = 14
quinze = 15
seize = 16
dix-sept = 17
dix-huit = 18
dix-neuf = 19
vingt = 20
trente = 30
quarante = 40
cinquante = 50
soixante = 60
soixante-dix = 70
septante = 70
quatre-vingt = 80
quatre-vingts = 80
huitante = 80
octante = 80
quatre-vingt-dix = 90
nonante = 90
cent = 100

[periods]
# les quatre derniers mois
adjectives = ["dernier", "dernière", "derniers", "dernières",
              "prochain", "prochaine", "prochains", "prochaines",
              "premier", "première", "premiers", "premières",
              "suivant", "suivante", "suivants", "suivantes",
              "plein", "pleine", "pleins", "pleines",
              "entier", "entière", "entiers", "entières"]
# 2 jours par semaine
frequency_words = ["par", "à la"]
frequency_cycles = ["semaine", "mois", "an", "année"]

[periods.units]
wd = ["jour ouvrable", "jours ouvrables", "jour ouvré", "jours ouvrés"]
d = ["jour", "jours"]
w = ["semaine", "semaines"]
m = ["mois"]
y = ["an", "ans", "année", "années"]

[periods.names]
d = ["jour", "jours"]
w = ["semaine", "semaines"]
m = ["mois", "mois"]
y = ["an", "ans"]
wd = ["jour ouvrable", "jours ouvrables"]

[phone]
style = "swiss"

[addresses]
five_digit_postcodes = false
street_word = "strasse"
