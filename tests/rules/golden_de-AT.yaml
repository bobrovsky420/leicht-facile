# Golden sentences for Austrian German (de-AT): the rules with a check or a table of
# their own for the variety (docs/rules.md, "German in Austria"). Austria keeps the
# Swiss Spital and writes Jänner, the minutes after a dot and the euro before the number.

REG-01:
  positive:
    - Die Strasse ist gesperrt.
    - Das ist gemäss Plan.
  negative:
    - Die Straße ist gesperrt.
    - Die Masse ist 5 Kilogramm.

