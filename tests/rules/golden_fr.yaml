# Golden sentences for the French rules (docs/rules.md, "Test plan for the checker").
# For every rule: sentences that must trigger it (positive) and sentences that must not
# (negative). Each entry is one block; an entry may be a mapping with `text`, `kind`
# (sentence | list_item | heading) and `level` (A2 | B1, default A2).
# All sentences are written by the team for these tests.

