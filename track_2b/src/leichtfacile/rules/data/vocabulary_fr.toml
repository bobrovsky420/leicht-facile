# -- explain -----------------------------------------------------------------------

[explain.law]
"décision" = "Une décision est la réponse d'un office ou d'un tribunal. Elle vaut pour vous. Elle arrive par lettre."
"notification" = "La notification est le jour de la remise de la décision. Le délai commence ce jour-là."
