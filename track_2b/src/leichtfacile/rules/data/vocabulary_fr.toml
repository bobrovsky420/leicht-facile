"voies de droit" = "Ce texte est à la fin d'une décision. Il explique vos moyens de défense. Il donne aussi la date limite et l'adresse."
"entrée en force" = "Personne ne peut plus se défendre contre la décision. La décision vaut maintenant pour de bon."
"délai" = "Un délai est le temps pour une tâche. Vous devez faire la tâche avant la fin du délai."
"prolongation de délai" = "Vous recevez plus de temps pour une tâche. Demandez-le à l'office avant la fin du délai."
"demande" = "Avec une demande, vous demandez quelque chose à un office. Par exemple de l'argent ou une permission."
"avoir droit à" = "Avoir droit à quelque chose veut dire : la loi dit que vous pouvez le recevoir."
"non-entrée en matière" = "L'office n'examine pas votre demande. Par exemple, il manque des documents. Ou le délai est passé."
