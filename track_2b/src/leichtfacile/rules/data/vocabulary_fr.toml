# French vocabulary for easy language (FALC A2, langage simplifié B1), Swiss usage.
# Written for this project; checked by track_2b/tests/rules/test_vocabulary.py.
#
# [replace.<group>]  hard word = everyday word to use instead. A suggestion for the
#                    writer and the checker, not a blind substitution: the sentence
#                    may need a change ("s'acquitter de la facture" -> "payer la
#                    facture").
# [explain.<group>]  a term that has to stay, because the reader meets it again on
#                    forms, letters and the phone = a plain explanation for the
#                    glossary, in short sentences that pass the checker.
# [<kind>.context]   words with a second, everyday sense: the writer gets them as a
#                    hint, code never flags or adds them on its own.
# [not_in]           phrases in which a term does not count (zur Verfügung).
#
# A trailing "# TERMDAT <id>" names the entry of the federal terminology database
# (www.termdat.bk.admin.ch/entry/<id>) that confirms the official term.
# Terms TERMDAT lacks name the act that defines them instead ("# ELG Art. 11").
#
# Base forms: nouns in the singular, verbs in the infinitive, adjectives in the
# masculine. Straight apostrophe. Every term appears once per file.

