# Release: for every version tag (v0.1.0, ...) the wheel goes to a GitHub release and
# to PyPI, and the container image to ghcr.io/bobrovsky420/leichtfacile, tagged with the
# version and as latest.
#
# PyPI takes it by trusted publishing: pypi.org trusts this workflow (the project's
# publisher settings name the repository and release.yml), so no token is stored. The
# spaCy models come as the dependencies leichtfacile-model-de and -fr, published
# beforehand by models.yml, and the sample letters as leichtfacile-samples, published
# beforehand by samples.yml with a version of its own. The tag must match the version in
# pyproject.toml; tests/test_release.py keeps publiccode.yml in step with it and the
# documents free of exact versions (the package reads its own from its metadata). The
# image job runs after the wheel's, so a release whose tests fail publishes no image; it
# pushes with the workflow's own token (packages: write), and the package's visibility is
# set once by hand on GitHub (a package starts private).
#
# Both artifacts come with provenance and a bill of materials (SECURITY.md, "Verifying a
# release"): GitHub's build-provenance action signs a statement that binds the wheel's and
# the image's digests to this repository, the tagged commit and this workflow (Sigstore,
# the workflow's own identity, `gh attestation verify`); uv uploads the PyPI attestation
# (PEP 740) under trusted publishing, and the wheel job fails if pypi.org does not hold it
# afterwards; Trivy writes a CycloneDX bill of materials of the locked dependencies and one
# of the image, attached to the release and attested the same way. The attestation steps
# run after the artifacts are published, so a failing attestation never withholds a
# release, it turns the job red. Every action is pinned to a commit; the comment after the
# hash names the release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheel:
    name: Build and publish the wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # trusted publishing to PyPI, and the attestations' signatures
      attestations: write  # the provenance of the wheel and its bill of materials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: The tag matches the project version
        id: version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Versions and install commands agree
        run: |
          uv sync --frozen
          uv run pytest -q tests/test_release.py
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      # A clean environment outside the checkout: the models and the sample letters come
      # as a user gets them (the model packages and the samples package from PyPI), the
      # rule checker loads the models and the app lists the letters, so a missing package,
      # model or letter fails here, not on a user's machine.
      - name: Install it in a clean environment and run the checker
        working-directory: ${{ runner.temp }}
        run: |
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/leichtfacile --version
          printf 'Sie müssen die Rechnung bis zum 30. November 2026 bezahlen.\n' > text.txt
          LEICHTFACILE_DATA__DIR="$RUNNER_TEMP/data" smoke/bin/leichtfacile check text.txt --lang de
          LEICHTFACILE_DATA__DIR="$RUNNER_TEMP/data" smoke/bin/python -c \
            "from leichtfacile.examples import example_sources; assert example_sources()"
      - name: The bill of materials of the locked dependencies (CycloneDX, from uv.lock)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: leichtfacile-${{ steps.version.outputs.version }}-dependencies.cdx.json
      - name: Publish the release, the bill of materials next to the wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl leichtfacile-*-dependencies.cdx.json \
            --title "Leicht·Facile ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      # The PyPI attestation (PEP 740): uv publish creates none (0.10.0 reached PyPI
      # without one), and it uploads a `<file>.publish.attestation` only when that file is
      # among the files it is given, so the glob is dist/*, not dist/*.whl (0.10.1 reached
      # PyPI without one too; uv-publish, group_files). pypi-attestations signs with this
      # workflow's identity token through Sigstore, the identity PyPI's trusted publisher
      # names; the version is pinned and resolved under the same week's cooldown as the
      # lockfile. The dry run against an address nothing listens on proves the pairing
      # offline, before the upload that cannot be repeated.
      - name: Sign the wheel for PyPI
        run: uvx --exclude-newer "7 days" --from "pypi-attestations==0.0.30" pypi-attestations sign dist/*.whl
      - name: uv pairs the attestation with the wheel
        run: |
          uv publish -v --dry-run --publish-url http://127.0.0.1:9/legacy/ \
            --username dry-run --password dry-run dist/* 2>&1 | tee dry-run.log
          grep -q "Found attestation for distribution: .*\.whl\.publish\.attestation" dry-run.log
      - name: Publish to PyPI, the attestation with the wheel
        run: uv publish --trusted-publishing always dist/*
      - name: Attest the wheel's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - name: Attest the bill of materials
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: leichtfacile-${{ steps.version.outputs.version }}-dependencies.cdx.json
      - name: PyPI holds the wheel's provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://pypi.org/integrity/leichtfacile/$version/leichtfacile-$version-py3-none-any.whl/provenance"
          for i in $(seq 1 24); do
            if curl -fsS -o provenance.json "$url"; then
              echo "PyPI holds the provenance: $url"
              exit 0
            fi
            sleep 5
          done
          echo "no provenance on PyPI two minutes after the upload: $url"
          exit 1

  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    needs: wheel
    permissions:
      contents: write  # the image's bill of materials joins the release
      packages: write  # ghcr.io, with the workflow's own token
      id-token: write  # the attestations' signatures
      attestations: write  # the provenance of the image and its bill of materials
    env:
      IMAGE: ghcr.io/bobrovsky420/leichtfacile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The wheel job has checked that the tag names the project version.
      - name: The version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the image, tagged with the version and as latest
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --tag "$IMAGE:$version" --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      # As the wheel job does in its clean environment: the version, and the checker
      # with the language packages the image carries.
      - name: The image runs the version of the tag and its checker
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(docker run --rm "$IMAGE:$version" leichtfacile --version)" = "$version"
          docker run --rm "$IMAGE:$version" sh -c \
            "printf 'Sie müssen die Rechnung bis zum 30. November 2026 bezahlen.\n' > /tmp/text.txt && leichtfacile check /tmp/text.txt --lang de"
      - name: Publish to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
      - name: The digest of the pushed image
        id: pushed
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest"
      - name: Attest the image's provenance, in ghcr.io next to the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true
      - name: The bill of materials of the image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: leichtfacile-${{ steps.version.outputs.version }}-image.cdx.json
      - name: Attest the bill of materials
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          sbom-path: leichtfacile-${{ steps.version.outputs.version }}-image.cdx.json
          push-to-registry: true
      - name: Add the bill of materials to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "leichtfacile-${GITHUB_REF_NAME#v}-image.cdx.json" --clobber
