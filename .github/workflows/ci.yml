# Continuous integration: lint, types, tests and a start of the service.
#
# The types job runs mypy over the package and the scripts with the settings of
# pyproject.toml ([tool.mypy]); the tests are not checked yet. The test job of the
# Python version .python-version pins measures the coverage of the package as well and
# writes it to the job summary, a number to read, not a threshold. No model endpoint is
# needed: the tests answer model calls from a fake endpoint, and
# the serve job starts the app against an unreachable endpoint (llm.url) to show that
# the service and its liveness check do not depend on it. The container job builds the
# image (Dockerfile), starts it the same way with a token, checks the probes and the
# login through the published port, starts it again published on the loopback interface
# alone (server.published_on), where no login is asked, and scans the image for
# vulnerabilities that have a fix (Trivy, high and critical; one without a fix is reported
# and does not fail the job). The secrets job scans every commit of the history with
# gitleaks, and the dependencies job scans uv.lock with Trivy under the same policy as
# the image, without building it (docs/architecture.md §10, "Supply chain"). The signoff
# job runs on pull requests alone: unless the author is a maintainer (MAINTAINERS.md) or
# a bot, every commit carries a Signed-off-by line (CONTRIBUTING.md, "Sign-off"). Every
# action is pinned to a commit; the comment after the hash names the release; gitleaks,
# a download, is pinned by its checksum.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # uv reads .python-version and installs that interpreter itself.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    name: Tests (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # pyproject.toml declares 3.12 and later; every supported minor version is tested.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Sets UV_PYTHON, which wins over .python-version.
          python-version: ${{ matrix.python }}
      # The spaCy models come from PyPI as leichtfacile-model-de and -fr, pinned in
      # uv.lock; nothing else is downloaded after this step.
      - run: uv sync --frozen
      # On the version .python-version pins, the coverage of the package is measured
      # as well and written to the job summary (pytest-cov, [tool.coverage] of
      # pyproject.toml): the total and the files with lines not covered. A number to
      # read, not a threshold.
      - if: matrix.python != '3.14'
        run: uv run pytest -q
      - if: matrix.python == '3.14'
        run: |
          uv run pytest -q --cov --cov-report=
          echo "coverage of the package: $(uv run coverage report --format=total) % of the lines"
          {
            echo "## Coverage of the package (lines, Python ${{ matrix.python }}; files with every line covered left out)"
            echo
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

  serve:
    name: The service starts without its endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Start it with an unreachable endpoint and call /healthz and /readyz
        env:
          # A provider and a preset of their own, without any file (docs/configuration.md).
          LEICHTFACILE_LLM__PRESET: ci
          LEICHTFACILE_PROVIDERS__CI__URL: http://127.0.0.1:9/v1
          LEICHTFACILE_PROVIDERS__CI__API_KEY: none
          LEICHTFACILE_PRESETS__CI__PROVIDER: ci
          LEICHTFACILE_PRESETS__CI__MODELS__WRITER: any-model
          LEICHTFACILE_DATA__DIR: ${{ runner.temp }}/data
        run: |
          .venv/bin/leichtfacile serve --no-browser > serve.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz -o healthz.json; then
              cat healthz.json
              # Liveness is 200 even when the endpoint is down; readiness says so.
              curl -fsS http://127.0.0.1:8000/readyz -o readyz.json
              cat readyz.json
              grep -q '"reachable": *false' readyz.json
              exit 0
            fi
            sleep 2
          done
          echo "the service did not answer within 90 s"
          cat serve.log
          exit 1

  container:
    name: The container image builds, starts and passes the scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag leichtfacile:ci .
      - name: Start it with an unreachable endpoint and a token, and wait for its health check
        env:
          # The provider and preset of the serve job, and the login the app demands on
          # every interface of its container (the Dockerfile).
          LEICHTFACILE_LLM__PRESET: ci
          LEICHTFACILE_PROVIDERS__CI__URL: http://127.0.0.1:9/v1
          LEICHTFACILE_PROVIDERS__CI__API_KEY: none
          LEICHTFACILE_PRESETS__CI__PROVIDER: ci
          LEICHTFACILE_PRESETS__CI__MODELS__WRITER: any-model
          LEICHTFACILE_AUTH__TOKEN: ci-token
        run: |
          docker run --detach --name leichtfacile --publish 127.0.0.1:8000:8000 \
            --env LEICHTFACILE_LLM__PRESET --env LEICHTFACILE_PROVIDERS__CI__URL \
            --env LEICHTFACILE_PROVIDERS__CI__API_KEY --env LEICHTFACILE_PRESETS__CI__PROVIDER \
            --env LEICHTFACILE_PRESETS__CI__MODELS__WRITER --env LEICHTFACILE_AUTH__TOKEN \
            --health-interval 5s --health-start-period 30s leichtfacile:ci
          # The image's own health check, at a shorter interval for the job; a success
          # inside the start period counts at once, a failure there does not.
          for i in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' leichtfacile)"
            if [ "$health" = healthy ]; then
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              break
            fi
            sleep 3
          done
          echo "the container is $health"
          docker logs leichtfacile
          exit 1
      - name: The probes answer, the login holds and the app runs unprivileged
        env:
          LEICHTFACILE_AUTH__TOKEN: ci-token
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz -o readyz.json
          cat readyz.json
          grep -q '"reachable": *false' readyz.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LEICHTFACILE_AUTH__TOKEN" http://127.0.0.1:8000/)" = 200
          test "$(docker exec leichtfacile id -u)" = 10001
      - name: Published on this machine alone, it runs without a login
        env:
          LEICHTFACILE_LLM__PRESET: ci
          LEICHTFACILE_PROVIDERS__CI__URL: http://127.0.0.1:9/v1
          LEICHTFACILE_PROVIDERS__CI__API_KEY: none
          LEICHTFACILE_PRESETS__CI__PROVIDER: ci
          LEICHTFACILE_PRESETS__CI__MODELS__WRITER: any-model
          # The address the port is published on, judged instead of the bind address.
          LEICHTFACILE_SERVER__PUBLISHED_ON: 127.0.0.1
        run: |
          docker rm --force leichtfacile
          docker run --detach --name leichtfacile --publish 127.0.0.1:8000:8000 \
            --env LEICHTFACILE_LLM__PRESET --env LEICHTFACILE_PROVIDERS__CI__URL \
            --env LEICHTFACILE_PROVIDERS__CI__API_KEY --env LEICHTFACILE_PRESETS__CI__PROVIDER \
            --env LEICHTFACILE_PRESETS__CI__MODELS__WRITER --env LEICHTFACILE_SERVER__PUBLISHED_ON \
            leichtfacile:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 200 \
            || { docker logs leichtfacile; exit 1; }
      - name: Scan the image for vulnerabilities with a fix (high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leichtfacile:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
      - name: Stop it
        if: always()
        run: docker rm --force leichtfacile

  secrets:
    name: No secret in the whole history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every commit: a key committed and removed again is still in the history
      # The release's file through the API (gh release download), not its /download/
      # address, which answered 504 for hours on 8 November 2026 while the API served it.
      - name: Scan every commit, with the project's allowlist (.gitleaks.toml)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  dependencies:
    name: The lockfile has no fixable high or critical vulnerability (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan uv.lock under the policy of the image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  signoff:
    name: Every commit of an outside pull request is signed off (DCO)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip a maintainer or a bot, else require a Signed-off-by line on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The logins from the list items of MAINTAINERS.md, in the form it asks for.
          maintainers="$(grep -E '^- ' MAINTAINERS.md | grep -oE 'GitHub login `[A-Za-z0-9-]+`' | tr -d '`' | awk '{print $3}')"
          test -n "$maintainers" || { echo "::error::MAINTAINERS.md names no GitHub login"; exit 1; }
          case " $(echo $maintainers) " in
            *" $AUTHOR "*) echo "$AUTHOR is a maintainer: no sign-off required"; exit 0 ;;
          esac
          case "$AUTHOR" in
            *'[bot]') echo "$AUTHOR is a bot: no sign-off required"; exit 0 ;;
          esac
          missing=0
          while read -r sha signed; do
            if [ "$signed" = 0 ]; then
              echo "::error::commit $sha has no Signed-off-by line"
              missing=1
            fi
          done < <(gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" \
            --jq '.[] | "\(.sha) \([.commit.message | split("\n")[] | select(test("^Signed-off-by: .+ <.+>$"))] | length)"')
          if [ "$missing" = 1 ]; then
            echo "Sign off every commit (CONTRIBUTING.md, \"Sign-off\"): git commit --amend -s for the last one,"
            echo "git rebase --signoff origin/main for all of them, then push again."
            exit 1
          fi
          echo "every commit is signed off"
