# Continuous integration: lint, tests and a start of the Docker image.
#
# No model endpoint is needed: the tests answer model calls from a fake endpoint, and
# the Docker job starts the image against an unreachable LLM_BASE_URL to show that the
# service and its liveness check do not depend on the endpoint. Every action is pinned
# to a commit; the comment after the hash names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # uv reads .python-version and installs that interpreter itself.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # pyproject.toml declares 3.12 and later; every supported minor version is tested.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Sets UV_PYTHON, which wins over .python-version.
          python-version: ${{ matrix.python }}
      # The spaCy models come from the wheel URLs pinned in uv.lock; nothing else
      # is downloaded after this step.
      - run: uv sync --frozen
      - run: uv run pytest -q

  docker:
    name: Docker image starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t leicht-facile:ci .
      - name: Start it with an unreachable endpoint and call /healthz and /readyz
        run: |
          docker run -d --name app -p 127.0.0.1:8000:8000 \
            -e LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e LLM_API_KEY=none \
            -e LLM_NAME=swiss-ai/Apertus-v1.5-8B \
            leicht-facile:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz -o healthz.json; then
              cat healthz.json
              # Liveness is 200 even when the endpoint is down; readiness says so.
              curl -fsS http://127.0.0.1:8000/readyz -o readyz.json
              cat readyz.json
              grep -q '"reachable": *false' readyz.json
              exit 0
            fi
            sleep 2
          done
          echo "the service did not answer within 90 s"
          docker logs app
          exit 1
      - name: Stop it
        if: always()
        run: docker rm -f app
      # Vulnerability scan of the image: advisory only, it never fails the build.
      - name: Scan the image (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leicht-facile:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
