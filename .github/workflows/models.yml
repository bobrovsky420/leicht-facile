# The checker's pipelines as packages on PyPI: leichtfacile-model-de and -fr are spaCy's
# German and French models, built by scripts/model_packages.py from the tables
# [tool.leichtfacile.spacy-models] in pyproject.toml; leichtfacile-model-it is the
# Italian pipeline with the Morph-it! lexicon as its tagger, built by
# scripts/lexicon_package.py from [tool.leichtfacile.lexicon-models.it] (every spaCy
# Italian model is licensed for non-commercial use only). Run by hand (Actions, Models,
# Run workflow) after a change of those tables, before the dependencies in
# pyproject.toml name the new versions.
#
# PyPI takes them by trusted publishing, as release.yml does. PyPI keeps one pending
# publisher per repository, workflow and environment, so each package publishes from a
# job with an environment of its own (pypi-model-de, pypi-model-fr, pypi-model-it), and
# its publisher names this repository, models.yml and that environment. A wheel already
# on PyPI is skipped: with a notice when the rebuild gives the same bytes, with a warning
# when it differs. The wheels name the project's Homepage, so the versions on PyPI built
# before it became https://leichtfacile.ch (28 October 2026), the de and fr 3.8.0, differ
# from a rebuild and get the warning. Every action is pinned to a commit; the comment
# after the hash names the release.

name: Models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: leichtfacile-model-${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: de
            build: uv run --no-project python scripts/model_packages.py --lang de --out dist/models
            text: Sie müssen die Rechnung bis zum 30. November bezahlen.
            annotation: DEP
          - lang: fr
            build: uv run --no-project python scripts/model_packages.py --lang fr --out dist/models
            text: Vous devez payer la facture avant le 30 novembre.
            annotation: DEP
          # Building the Italian pipeline needs spaCy, and the package then requires at
          # least the spaCy it was built with: the version here is uv.lock's.
          - lang: it
            build: uv run --no-project --with "spacy==3.8.18" python scripts/lexicon_package.py --out dist/models
            text: Deve pagare la fattura entro il 30 novembre.
            annotation: MORPH
    environment: pypi-model-${{ matrix.lang }}
    permissions:
      id-token: write  # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Outside the project's environment, which depends on these packages.
      - name: Build it
        run: ${{ matrix.build }}
      # A clean environment: the package installs with its spaCy and annotates a
      # sentence with what the rule checker reads: a parse (German, French) or the
      # lexicon's morphology (Italian).
      - name: Install it in a clean environment and annotate a sentence
        working-directory: ${{ runner.temp }}
        env:
          MODEL: leichtfacile_model_${{ matrix.lang }}
          TEXT: ${{ matrix.text }}
          ANNOTATION: ${{ matrix.annotation }}
        run: |
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/models/*.whl
          smoke/bin/python - <<'EOF'
          import os
          import spacy
          doc = spacy.load(os.environ["MODEL"])(os.environ["TEXT"])
          assert doc.has_annotation(os.environ["ANNOTATION"]) and doc.has_annotation("MORPH")
          print(" ".join(f"{t.text}/{t.pos_}/{t.dep_ or t.tag_}" for t in doc))
          EOF
      # PyPI takes a file once. A wheel already there is not published again: a notice
      # when this build gives the same bytes, a warning when it differs (a change that
      # needs a new version in the table).
      - name: Publish to PyPI
        run: |
          wheel=$(ls dist/models/*.whl)
          file=$(basename "$wheel")
          name=$(echo "$file" | cut -d- -f1 | tr _ -)
          version=$(echo "$file" | cut -d- -f2)
          remote=$(curl -sf "https://pypi.org/pypi/$name/$version/json" \
            | jq -r --arg f "$file" '.urls[] | select(.filename == $f) | .digests.sha256' || true)
          built=$(sha256sum "$wheel" | cut -d' ' -f1)
          if [ -z "$remote" ]; then
            uv publish --trusted-publishing always "$wheel"
          elif [ "$remote" = "$built" ]; then
            echo "::notice::$file is on PyPI already, the same bytes"
          else
            echo "::warning::$file is on PyPI already and differs from this build; a change needs a new version in pyproject.toml"
          fi
