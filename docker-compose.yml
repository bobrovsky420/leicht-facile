# Default: the app only, talking to a remote Apertus endpoint (CSCS, Swiss cloud,
# Hugging Face) configured in .env.
#
# The three required variables (LLM_BASE_URL, LLM_API_KEY, LLM_NAME) may also come
# from the shell, with or without a .env file; the shell wins over .env.
#
# On-premise / air-gapped: `docker compose --profile local-llm up` adds a vLLM server
# with Apertus 1.5 8B on one NVIDIA GPU with 24 GB or more (run on an L4 on 10 October
# 2026, track_2b/eval/hardware/). Point the app at it in .env:
#   LLM_BASE_URL=http://vllm:8000/v1
#   LLM_API_KEY=local            (any value; vLLM is started without a key)
#   LLM_NAME=swiss-ai/Apertus-v1.5-8B
#   LLM_THINKING_MODE=chat-template
#
# Small offices: `docker compose --profile local-llm-small up` adds a llama.cpp server
# with a community 4-bit text-only conversion of Apertus 1.5 8B (unofficial, no image
# input) that fits a GPU with 8 GB. The weights (5 GB) are downloaded on first start.
#   LLM_BASE_URL=http://llamacpp:8080/v1
#   LLM_API_KEY=local
#   LLM_NAME=apertus-v1.5-8b-q4-llamacpp
#   LLM_THINKING_MODE=chat-template
#   LLM_TIMEOUT_S=1800

services:
  app:
    build: .
    image: leicht-facile:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # The interface the port is published on (below), so the app knows where it is
      # reachable: beyond the loopback interface it refuses to start without a login
      # (AUTH_TOKEN or AUTH_PROXY_HEADER in .env; track_2b/docs/architecture.md §10).
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      # Passed through from the shell when set there; otherwise the value from .env.
      LLM_BASE_URL:
      LLM_API_KEY:
      LLM_NAME:
    volumes:
      - appdata:/data
    ports:
      # This machine only, by default: http://localhost:8000. A reverse proxy on the host
      # publishes the app to the organisation; BIND_HOST=0.0.0.0 in .env publishes it on
      # every interface itself, which needs a login (above).
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  vllm:
    profiles: ["local-llm"]
    image: ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-amd64
    entrypoint: ["vllm", "serve"]
    command:
      - swiss-ai/Apertus-v1.5-8B
      - --served-model-name=swiss-ai/Apertus-v1.5-8B
      - --chat-template-content-format=string
      - --reasoning-parser=apertus
      - --max-model-len=32768
      - --gpu-memory-utilization=0.9
      - --kv-cache-dtype=fp8      # the 32k context fits a 24 GB GPU (L4: 38,752 tokens)
      - --max-num-seqs=16         # smaller CUDA graphs and sampler warm-up, so it all fits
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  llamacpp:
    profiles: ["local-llm-small"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -hf
      - Colby/apertus-v1.5-8b-text-Q4_K_M-GGUF
      - -ngl
      - "99"
      - -c
      - "16384"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --jinja
      - -sp                       # keep the reasoning markers, the client strips them
      - -np
      - "1"
      - --alias
      - apertus-v1.5-8b-q4-llamacpp
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llamacpp-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  appdata:
  hf-cache:
  llamacpp-models:
